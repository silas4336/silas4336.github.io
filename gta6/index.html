<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GTA 6 章節與任務攻略</title>
<meta name="description" content="GTA 6 章節與任務攻略：分章流程路書、各章必做清單、會錯過提醒、收集圖鑑與全文搜尋（個人使用）">
<meta name="theme-color" content="#111318">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GTA6 攻略">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
/* 畫面出現前先套用主題與字級，避免閃一下 */
try {
  var t = JSON.parse(localStorage.getItem("gta6.theme"));
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  var f = JSON.parse(localStorage.getItem("gta6.fs"));
  if (f >= 14 && f <= 26) document.documentElement.style.setProperty("--fs", f + "px");
} catch (e) {}
</script>
<style>
:root{
  --bg:#111318; --surface:#1a1d24; --surface2:#242934; --line:#2e3443;
  --text:#eceef3; --muted:#949db0; --accent:#ef476f; --accent2:#f5a623; --ok:#2ecc8a;
  --on-accent:#fff; --shadow:0 10px 30px rgba(0,0,0,.45);
  --badge-bg:#f2f4f8; --badge-fg:#12151c;
  --rail-bg:#14171e; --rail-line:#272c38; --rail-text:#d8dde7; --rail-muted:#7d8699;
  --fs:17px; --hh:calc(52px + env(safe-area-inset-top)); --nh:calc(58px + env(safe-area-inset-bottom)); --bh:46px;
  --b-main:#ef476f; --b-side:#2ec4b6; --b-heist:#ff7a45; --b-stranger:#6ea8fe; --b-opt:#f5a623; --b-extra:#8d96a8;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    --bg:#f2f4f7; --surface:#ffffff; --surface2:#eaeef3; --line:#dde2ea;
    --text:#171a21; --muted:#5c6576; --accent:#d62458; --accent2:#c77700; --ok:#0e8c58;
    --shadow:0 8px 26px rgba(20,25,38,.12);
    --badge-bg:#171a21; --badge-fg:#ffffff;
    --b-main:#d62458; --b-side:#0c857d; --b-heist:#c94d18; --b-stranger:#3367d6; --b-opt:#a86b00; --b-extra:#5c6576;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f4f7; --surface:#ffffff; --surface2:#eaeef3; --line:#dde2ea;
  --text:#171a21; --muted:#5c6576; --accent:#d62458; --accent2:#c77700; --ok:#0e8c58;
  --shadow:0 8px 26px rgba(20,25,38,.12);
  --badge-bg:#171a21; --badge-fg:#ffffff;
  --b-main:#d62458; --b-side:#0c857d; --b-heist:#c94d18; --b-stranger:#3367d6; --b-opt:#a86b00; --b-extra:#5c6576;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  line-height:1.6;overflow-wrap:anywhere}
html.lock,html.lock body{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tnum{font-variant-numeric:tabular-nums}
[hidden]:not(.ib){display:none!important}

/* 頂欄 */
.top{position:fixed;inset:0 0 auto 0;z-index:35;height:var(--hh);padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--bg) 93%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .tt{flex:1;min-width:0;text-align:center;font-weight:750;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:12px}
.ib:active{background:var(--surface2)}
.ib[hidden]{display:block;visibility:hidden}
.ib.aa{font-weight:800;font-size:1rem;letter-spacing:-.02em}
.ib.spbtn{position:relative;color:var(--muted)}
.ib.spbtn.on{color:var(--ok)}
.ib.spbtn .spnum{position:absolute;right:5px;bottom:5px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;
  background:var(--ok);color:#06251a;font-size:.64rem;font-weight:900;line-height:16px;text-align:center;font-variant-numeric:tabular-nums}
#prog{position:fixed;z-index:36;left:0;top:var(--hh);height:2.5px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .08s linear;pointer-events:none}
#offline{position:fixed;z-index:34;left:0;right:0;top:var(--hh);padding:6px 14px;font-size:.8rem;text-align:center;background:var(--accent2);color:#14171e;font-weight:700}
#offline[hidden]{display:none}

main{padding:calc(var(--hh) + 14px) max(14px,env(safe-area-inset-right)) calc(var(--nh) + 32px) max(14px,env(safe-area-inset-left));max-width:780px;margin:0 auto;min-height:100dvh}
main[data-v="book"]{padding-top:calc(var(--hh) + var(--bh) + 12px)}

/* 底部導覽 */
.nav{position:fixed;inset:auto 0 0 0;z-index:35;height:var(--nh);padding:0 max(6px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(6px,env(safe-area-inset-left));
  display:flex;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav a,.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;
  text-decoration:none;font-size:.69rem;color:var(--muted);min-width:0;border-radius:12px;font-weight:500}
.nav a[aria-current="page"]{color:var(--accent);font-weight:750}

/* ───── 遊民路書風格：頂端目前節點列 + 深色時間軸抽屜／側欄 ───── */
.rb-bar{position:fixed;left:0;right:0;top:var(--hh);z-index:30;height:var(--bh);
  background:var(--rail-bg);color:var(--rail-text);border-bottom:1px solid var(--rail-line);
  display:flex;align-items:center;gap:4px;padding:0 max(8px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.rb-cur{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 4px;border:0;background:none;color:inherit;text-align:left;border-radius:10px}
.rb-cur:active{background:rgba(255,255,255,.08)}
.rb-cur .ncode{background:#fff;color:#12151c;font-size:.76rem;padding:2px 7px;min-width:2.3em;text-align:center}
.rb-cur .rb-name{flex:1;min-width:0;font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-cur .rb-hint{font-size:.72rem;color:var(--rail-muted);white-space:nowrap}
.rb-navbtn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--rail-line);background:rgba(255,255,255,.04);color:var(--rail-text);border-radius:10px;flex:none}
.rb-navbtn:active{background:rgba(255,255,255,.14)}
.rb-navbtn:disabled{opacity:.3;cursor:default}

/* 深色垂直時間軸（手機抽屜 / 桌機左側固定欄） */
.rb-back{position:fixed;inset:0;z-index:54;background:rgba(6,8,12,.62);animation:fade .15s}
.rb-drawer{position:fixed;inset:0 auto 0 0;z-index:55;width:min(88vw,340px);background:var(--rail-bg);color:var(--rail-text);
  border-right:1px solid var(--rail-line);box-shadow:0 16px 48px rgba(0,0,0,.6);display:flex;overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);animation:slideR .18s ease-out}
@keyframes slideR{from{transform:translateX(-100%)}}
.rb-flags{width:54px;flex:none;border-right:1px solid var(--rail-line);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:10px;background:#101318}
.rb-flag{width:38px;height:32px;border:0;padding:0 5px 0 0;background:#262b36;color:#9da6b8;font-weight:850;font-size:.88rem;
  display:grid;place-items:center;clip-path:polygon(0 0,76% 0,100% 50%,76% 100%,0 100%);border-radius:3px;transition:background .15s,color .15s}
.rb-flag[aria-current="true"]{background:#f8fafc;color:#12151c}
.rb-flag-sub{font-size:.62rem;color:var(--rail-muted);margin-top:-6px;font-variant-numeric:tabular-nums}
.rb-tl-wrap{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.rb-tl-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 8px 10px 14px;border-bottom:1px solid var(--rail-line)}
.rb-tl-head b{font-size:.94rem;display:block}
.rb-tl-head small{font-size:.74rem;color:var(--rail-muted);display:block}
.rb-tl-list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 10px 24px 12px}
.rb-tl-item{position:relative;display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--rail-text);
  text-align:left;padding:7px 8px 7px 22px;border-radius:10px;min-height:40px}
.rb-tl-item::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:#2c3240}
.rb-tl-item:first-child::before{top:50%}
.rb-tl-item:last-child::before{bottom:50%}
.rb-tl-dot{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;
  background:var(--rail-bg);border:2px solid #566075;z-index:1;transition:all .15s}
.rb-tl-item.is-done .rb-tl-dot{background:var(--ok);border-color:var(--ok)}
.rb-tl-item.is-cur{background:rgba(255,255,255,.09)}
.rb-tl-item.is-cur .rb-tl-dot{background:#fff;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(245,166,35,.32);width:12px;height:12px;left:3px}
.rb-tl-code{flex:none;font-size:.7rem;font-weight:800;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:5px;
  background:#272d3a;color:#aeb7c8;min-width:2.35em;text-align:center}
.rb-tl-item.is-cur .rb-tl-code{background:#fff;color:#12151c}
.rb-tl-item.is-done .rb-tl-code{opacity:.7}
.rb-tl-name{flex:1;min-width:0;font-size:.84rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-tl-item.is-cur .rb-tl-name{color:#fff;font-weight:750}
.rb-tl-item.is-done .rb-tl-name{color:var(--rail-muted);text-decoration:line-through}
.rb-tl-ico{font-size:.68rem;color:var(--accent2);flex:none}
.rb-tl-ico.m{color:var(--rail-muted);opacity:.55}
.rb-desktop-rail{display:none}

/* 路書節點卡 */
.ncode{display:inline-flex;align-items:center;justify-content:center;padding:3px 8px;border-radius:6px;
  background:var(--badge-bg);color:var(--badge-fg);font-weight:850;font-size:.82rem;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;line-height:1.2;flex:none}
.rcard{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:clip;
  scroll-margin-top:calc(var(--hh) + var(--bh) + 10px);content-visibility:auto;contain-intrinsic-size:auto 420px}
.rcard.is-done{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.rcard.flash-card{animation:flash 2.2s ease-out}
.rcard-h{display:flex;align-items:flex-start;gap:10px;padding:14px 12px 10px 14px}
.rcard-h .ncode{margin-top:2px;font-size:.86rem;padding:4px 9px}
.rcard.is-done .rcard-h .ncode{background:var(--ok);color:#06251a}
.rcard-t{flex:1;min-width:0}
.rcard-t h2{margin:0;font-size:1.18rem;line-height:1.3;font-weight:800}
.rcard.is-done .rcard-t h2{color:var(--muted)}
.rcard-sub{margin-top:2px;font-size:.78rem;color:var(--muted);line-height:1.4}
.rcard-acts{display:flex;align-items:center;gap:2px;flex:none;margin:-4px -4px 0 0}
.rcard-acts .favbtn{width:38px;height:38px;border:0;background:none;border-radius:10px;font-size:1.05rem;color:var(--muted);display:grid;place-items:center}
.rcard-acts .favbtn[aria-pressed="true"]{color:var(--accent2)}
.rcard-acts .chkbtn{width:42px;height:42px;border:0;background:none;display:grid;place-items:center}
.rcard-acts .chkbtn span{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:all .15s}
.rcard-acts .chkbtn svg{width:15px;height:15px;stroke-width:3;opacity:0}
.rcard.is-done .rcard-acts .chkbtn span{background:var(--ok);border-color:var(--ok);color:#06251a}
.rcard.is-done .rcard-acts .chkbtn svg{opacity:1}

/* 遊民風格標籤晶片（圓點/圖示 + 名稱 + 數量分隔） */
.rcard-tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.rtag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface2);font-size:.75rem;font-weight:650;line-height:1.4;color:var(--text)}
.rtag i.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.rtag em{font-style:normal;padding-left:5px;margin-left:2px;border-left:1px solid var(--line);font-variant-numeric:tabular-nums;opacity:.85}
.rtag.t-main{color:var(--b-main);border-color:color-mix(in srgb,var(--b-main) 35%,var(--line))}
.rtag.t-side{color:var(--b-side);border-color:color-mix(in srgb,var(--b-side) 35%,var(--line))}
.rtag.t-heist{color:var(--b-heist);border-color:color-mix(in srgb,var(--b-heist) 35%,var(--line))}
.rtag.t-stranger{color:var(--b-stranger);border-color:color-mix(in srgb,var(--b-stranger) 35%,var(--line))}
.rtag.t-opt{color:var(--b-opt);border-color:color-mix(in srgb,var(--b-opt) 35%,var(--line))}
.rtag.t-extra{color:var(--b-extra)}
.rtag.t-trophy{color:var(--accent2);border-color:color-mix(in srgb,var(--accent2) 45%,var(--line));background:color-mix(in srgb,var(--accent2) 10%,var(--surface2))}
.rtag.t-hard{color:#ff6b6b;border-color:rgba(255,107,107,.45);background:rgba(255,107,107,.1)}
.rtag.t-who-j{color:var(--b-side)}.rtag.t-who-l{color:var(--b-main)}

.rcard-b{padding:0 14px 14px;font-size:var(--fs);line-height:1.82;letter-spacing:.01em}
.rcard-b p{margin:.85em 0}
.rcard-b p:first-child{margin-top:.2em}
.rcard-b [data-b]{scroll-margin-top:calc(var(--hh) + var(--bh) + 16px)}
.rcard-b.steps p[data-k],.rcard-b.steps .stp>li,.rcard-b.steps .bl>li{cursor:pointer;transition:opacity .15s}
.rcard-b p.sd{opacity:.44;box-shadow:inset 3px 0 0 var(--ok);padding-left:10px;margin-left:-10px}
.rcard-b .bl>li.sd{opacity:.44}

.see-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 12px;padding:11px 13px;
  border-radius:12px;border:1px solid color-mix(in srgb,var(--accent2) 48%,var(--line));
  background:color-mix(in srgb,var(--accent2) 11%,var(--surface2));text-decoration:none;font-size:.88rem;line-height:1.45}
.see-banner b{color:var(--accent2)}
.see-banner>span:last-child{white-space:nowrap;flex:none;color:var(--accent2);font-weight:750}
.covers-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 10px;padding:8px 11px;border-radius:10px;
  background:var(--surface2);font-size:.8rem;color:var(--muted)}
.covers-bar a{text-decoration:none;padding:2px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:650}

/* 路書內可收合逐步清單與常見卡關 */
details.rb-steps{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:clip}
details.rb-steps>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;
  font-size:.88rem;font-weight:700;cursor:pointer;background:var(--surface2);min-height:44px}
details.rb-steps>summary::-webkit-details-marker{display:none}
details.rb-steps .rb-st-in{padding:6px 12px 12px}
details.rb-steps .chev,.ch-ov-miss .chev,.rb-stuck .chev{transition:transform .18s;color:var(--muted)}
details.rb-steps[open] .chev,.ch-ov-miss[open] .chev,.rb-stuck[open] .chev{transform:rotate(90deg)}
.rb-stuck{margin-top:12px;border:1px solid color-mix(in srgb,#ff6b6b 35%,var(--line));border-radius:12px;overflow:clip;background:color-mix(in srgb,#ff6b6b 5%,var(--surface))}
.rb-stuck>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:9px 13px;font-size:.84rem;font-weight:750;color:#ff7b7b;cursor:pointer}
.rb-stuck>summary::-webkit-details-marker{display:none}
.rb-stuck .hit{font-size:.88rem;padding:10px 13px}
.rcard-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface2) 45%,var(--surface))}
.rbtn{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);font-size:.8rem;font-weight:650;text-decoration:none;min-height:36px}
.rbtn.ok{background:var(--ok);border-color:var(--ok);color:#06251a}
.rbtn:active{filter:brightness(.92)}
.rbtn svg.i{width:15px;height:15px}

/* 章節概況卡（路書頂部） */
.ch-ov{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:clip}
.ch-ov-top{padding:16px;background:linear-gradient(135deg,#181c26 0%,#26202e 65%,#332129 100%);color:#f4f6fa}
.ch-ov-row{display:flex;align-items:center;gap:10px}
.ch-flag-big{width:44px;height:36px;display:grid;place-items:center;padding-right:6px;background:#fff;color:#12151c;
  font-weight:900;font-size:1.1rem;clip-path:polygon(0 0,76% 0,100% 50%,76% 100%,0 100%);border-radius:4px;flex:none}
.ch-ov-top h1{margin:0;font-size:1.3rem;line-height:1.25}
.ch-ov-top .subt{font-size:.82rem;opacity:.82;margin-top:2px}
.ch-ov-top .bar{margin-top:12px}
.ch-ov-top .stats{margin-top:8px;font-size:.8rem}
.ch-ov-body{padding:12px 16px 14px}
.ch-ov-body .lead{margin:0 0 10px;font-size:.9rem;line-height:1.65}
.ch-ov-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ch-ov-miss{margin-top:10px;border:1px solid color-mix(in srgb,var(--accent2) 45%,var(--line));border-radius:12px;overflow:clip;
  background:color-mix(in srgb,var(--accent2) 8%,var(--surface))}
.ch-ov-miss>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:.86rem;font-weight:750;color:var(--accent2);cursor:pointer}
.ch-ov-miss>summary::-webkit-details-marker{display:none}
.ch-ov-miss .chev{transition:transform .2s;flex:none}
.ch-ov-miss[open]>summary .chev{transform:rotate(90deg)}

/* 任務與章節「該做清單」 */
.m-todo{margin:6px 0 12px;border:1px solid color-mix(in srgb,var(--accent2) 45%,var(--line));border-radius:12px;overflow:clip;
  background:color-mix(in srgb,var(--accent2) 7%,var(--surface))}
.m-todo-h{padding:7px 12px;font-size:.78rem;font-weight:800;color:var(--accent2);letter-spacing:.04em;
  background:color-mix(in srgb,var(--accent2) 10%,var(--surface2));border-bottom:1px solid color-mix(in srgb,var(--accent2) 25%,var(--line))}
.chkrow{display:flex;align-items:flex-start;border-top:1px solid var(--line);scroll-margin-top:calc(var(--hh) + 64px)}
.chkrow:first-child,.m-todo-h+.chkrow{border-top:0}
.chkrow .chk{flex:none;width:46px;align-self:stretch;border:0;background:none;display:grid;place-items:start center;padding-top:12px}
.chkrow .chk span{width:23px;height:23px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.chkrow .chk svg{width:15px;height:15px;stroke-width:3;opacity:0}
.chkrow.done .chk span{background:var(--ok);border-color:var(--ok);color:#06251a}
.chkrow.done .chk svg{opacity:1}
.chkrow .cb2{flex:1;min-width:0;padding:10px 12px 10px 0}
.chkrow .ct2{display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px;line-height:1.4}
.chkrow .ct2 b{font-size:.9rem;font-weight:700}
.chkrow.done .ct2 b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.chkrow .cn2{margin-top:3px;font-size:.82rem;line-height:1.55;color:var(--muted)}
.chkrow .cgo{display:inline-flex;align-items:center;margin-top:5px;font-size:.76rem;font-weight:700;color:var(--accent);text-decoration:none}
.ctag{font-size:.68rem;font-weight:750;padding:1px 6px;border-radius:5px;border:1px solid currentColor;line-height:1.4;white-space:nowrap}
.ct-miss{color:#ff6b6b;background:rgba(255,107,107,.1)}
.ct-prep{color:var(--b-side);background:color-mix(in srgb,var(--b-side) 12%,transparent)}
.ct-do{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.ct-end{color:var(--accent2);background:color-mix(in srgb,var(--accent2) 12%,transparent)}

/* 防雷保護、無回頭點提醒與私人筆記 */
.spbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line));background:color-mix(in srgb,var(--ok) 8%,var(--surface));font-size:.82rem}
.spbar .spt{display:flex;align-items:center;gap:7px;min-width:0;font-weight:650}
.spbar .spt svg{width:17px;height:17px;color:var(--ok);flex:none}
.spbar button,.spbar a{flex:none;border:0;background:none;color:var(--ok);font-weight:800;font-size:.8rem;padding:2px 4px;text-decoration:none;white-space:nowrap}
.spgate{padding:24px 18px;text-align:center;border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line));border-radius:16px;
  background:var(--surface);margin-top:8px}
.spgate svg.i{width:34px;height:34px;color:var(--ok);margin:0 auto 8px}
.spgate h2{margin:0;font-size:1.12rem}
.spgate p{margin:8px auto 0;max-width:42ch;font-size:.86rem;color:var(--muted);line-height:1.6}
.spgate .spacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
.spgate .spacts .btn{flex:1 1 130px;min-height:42px;font-size:.86rem}
.sp-pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 15px 4px}
.sp-pills button{min-height:42px;padding:7px 8px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:.84rem;font-weight:650}
.sp-pills button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#06251a;font-weight:800}
.sp-pills button.wide{grid-column:1/-1}
.ch-pill.is-lock,.rb-flag.is-lock{opacity:.52}
details.chap.is-lock>summary .ct small{color:var(--ok)}
.rcard.is-fold .rcard-tags,.rcard.is-fold .rcard-b,.rcard.is-fold .rcard-f{display:none}
.spfold-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px 12px;font-size:.8rem;color:var(--muted)}
.spfold-bar button{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:5px 11px;font-size:.78rem;font-weight:700;color:var(--text)}
.ponr-box{margin:6px 0 12px;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,#ff6b6b 50%,var(--line));
  background:color-mix(in srgb,#ff6b6b 10%,var(--surface))}
.ponr-box b{display:block;font-size:.82rem;color:#ff6b6b;margin-bottom:3px;letter-spacing:.02em}
.ponr-box p{margin:0;font-size:.84rem;line-height:1.58}
.ponr-box a{display:inline-flex;align-items:center;margin-top:6px;font-size:.78rem;font-weight:750;color:#ff6b6b;text-decoration:none}
.m-memo{margin:10px 0 2px;padding:9px 12px;border-radius:11px;border:1px solid var(--line);border-left:3px solid var(--b-stranger);
  background:color-mix(in srgb,var(--b-stranger) 8%,var(--surface));font-size:.86rem}
.m-memo-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px;font-size:.74rem;font-weight:800;color:var(--b-stranger)}
.m-memo-h button{border:0;background:none;color:var(--muted);font-size:.74rem;font-weight:700;padding:0}
.m-memo-t{white-space:pre-wrap;line-height:1.55}
.memo-ed{padding:12px 16px 16px}
.memo-ed textarea{width:100%;min-height:110px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font:inherit;font-size:.94rem;line-height:1.55;resize:vertical}
.memo-ed .cta{margin-top:12px}
.code-pin{display:inline-block;margin-top:6px;padding:5px 11px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.05rem;letter-spacing:.16em;font-weight:850;color:var(--accent2)}

/* 首頁（路書總覽／目錄） */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:20px 18px 16px;color:#fff;
  background:linear-gradient(135deg,#171b26 0%,#2d1b2c 55%,#7c243d 100%);box-shadow:var(--shadow)}
.hero .eyebrow{font-size:.72rem;letter-spacing:.16em;font-weight:750;opacity:.82}
.hero h1{margin:4px 0 12px;font-size:1.45rem;line-height:1.25}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),#fff);width:0;transition:width .3s}
.stats{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;font-size:.82rem;opacity:.92}

/* 首頁快速選章旗標列 */
.ch-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.ch-pill{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;border-radius:13px;
  border:1px solid var(--line);background:var(--surface);text-decoration:none;min-width:0}
.ch-pill:active{background:var(--surface2)}
.ch-pill .fl{width:30px;height:24px;display:grid;place-items:center;padding-right:4px;background:var(--badge-bg);color:var(--badge-fg);
  font-weight:850;font-size:.78rem;clip-path:polygon(0 0,76% 0,100% 50%,76% 100%,0 100%);border-radius:2px}
.ch-pill b{font-size:.76rem;line-height:1.2}
.ch-pill small{font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}

.cont{display:block;margin:12px 0 0;padding:13px 15px;border-radius:15px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.cont small{display:block;color:var(--muted);font-size:.75rem}
.cont strong{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:1rem;margin-top:3px}
.cont .go{color:var(--accent);font-size:.86rem;white-space:nowrap}
.cont .mini{height:4px;border-radius:9px;background:var(--surface2);margin-top:9px;overflow:hidden}
.cont .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}

details.chap{margin-top:12px;border:1px solid var(--line);border-radius:15px;background:var(--surface);overflow:clip}
details.chap>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 12px 13px 14px;cursor:pointer;min-height:56px}
details.chap>summary::-webkit-details-marker{display:none}
details.chap .ct{flex:1;min-width:0}
details.chap .ct b{display:block;font-size:1rem}
details.chap .ct small{color:var(--muted);font-size:.78rem}
details.chap .cn{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
details.chap .chev{transition:transform .2s;color:var(--muted)}
details.chap[open] .chev{transform:rotate(90deg)}
details.chap .cb{height:3px;background:var(--surface2)}
details.chap .cb i{display:block;height:100%;background:var(--ok);width:0}
.chap-bar{display:flex;gap:8px;padding:10px 13px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface2) 45%,var(--surface))}
.chap-bar a{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);text-decoration:none;font-size:.82rem;font-weight:700}
.chap-bar a.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chap-bar a.warn{border-color:color-mix(in srgb,var(--accent2) 50%,var(--line));color:var(--accent2)}

.row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.row .rl{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:10px 4px 10px 13px;text-decoration:none;min-height:54px}
.row:active{background:var(--surface2)}
.row .num{min-width:2.35em;flex:none;text-align:center;font-variant-numeric:tabular-nums;font-weight:800;font-size:.72rem;
  padding:2px 5px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.row.cur .num{background:var(--accent);color:var(--on-accent)}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{font-weight:650;line-height:1.35;display:flex;align-items:center;gap:5px}
.row .nm svg{width:14px;height:14px;color:var(--accent2);flex:none}
.row .nt{font-size:.78rem;color:var(--muted);line-height:1.4;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.row.cur{box-shadow:inset 3px 0 0 var(--accent)}
.row .chk{flex:none;width:50px;border:0;background:none;display:grid;place-items:center;color:var(--line)}
.row .chk span{width:23px;height:23px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.row .chk svg{width:15px;height:15px;stroke-width:3;opacity:0}
.row.done .chk span{background:var(--ok);border-color:var(--ok);color:#06251a}
.row.done .chk svg{opacity:1}
.badge{flex:none;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid currentColor;line-height:1.4;white-space:nowrap}
.b-main{color:var(--b-main)}.b-side{color:var(--b-side)}.b-heist{color:var(--b-heist)}
.b-stranger{color:var(--b-stranger)}.b-opt{color:var(--b-opt)}.b-extra{color:var(--b-extra)}.b-hard{color:#ff6b6b}

.sect{margin:22px 2px 8px;font-size:.76rem;letter-spacing:.1em;font-weight:750;color:var(--muted);display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.card{border:1px solid var(--line);border-radius:15px;background:var(--surface);overflow:clip}
.pad{padding:14px 15px}
.pad p{margin:.5em 0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.foot{margin:26px 4px 0;color:var(--muted);font-size:.76rem;line-height:1.7}
.foot a{color:var(--accent)}

/* 索引／晶片／搜尋 */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;margin:0 -14px;padding-inline:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.84rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.chip small{opacity:.72;margin-left:3px}
.sub{padding:8px 14px;font-size:.78rem;color:var(--muted);background:var(--surface2);border-top:1px solid var(--line);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub:first-child{border-top:0}
.sub a{color:var(--accent);text-decoration:none;font-size:.76rem}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.hit{display:block;padding:11px 14px;border-top:1px solid var(--line);text-decoration:none}
.hit:first-child{border-top:0}
.hit b{display:block;line-height:1.4}
.hit small{display:block;color:var(--muted);font-size:.74rem;margin-top:1px}
.hit p{margin:3px 0 0;font-size:.87rem;line-height:1.5;color:var(--text);opacity:.92}
mark{background:color-mix(in srgb,var(--accent2) 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.sbox{position:sticky;top:calc(var(--hh) + 6px);z-index:10;display:flex;gap:8px;align-items:center;padding:9px 13px;border:1px solid var(--line);border-radius:13px;background:var(--surface);box-shadow:var(--shadow)}
.sbox input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-size:.98rem;outline:none}
.sbox svg{color:var(--muted)}

/* 內文、圖片、按鍵帽、表格 */
.art{font-size:var(--fs);line-height:1.85;letter-spacing:.01em}
.art .kick{font-size:.76rem;color:var(--muted);letter-spacing:.06em;font-weight:700}
.art h1{margin:4px 0 8px;font-size:1.5em;line-height:1.3}
.art p{margin:1em 0}
.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,35%{background:color-mix(in srgb,var(--accent2) 38%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent2) 38%,transparent);border-radius:6px}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
.shot{margin:.9em -4px;border-radius:11px;overflow:hidden;background:var(--surface2);aspect-ratio:var(--ar,16/9);display:grid;place-items:center;position:relative}
.shot.ok{aspect-ratio:var(--ar,auto);display:block}
.shot img{display:block;width:100%;height:auto;cursor:zoom-in}
.shot.loading::after{content:"";width:24px;height:24px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;position:absolute}
@keyframes sp{to{transform:rotate(1turn)}}
.imgbtn{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:10px;padding:10px 14px;font-size:.82rem}
.cta{display:flex;gap:9px;margin:18px 0 8px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:9px 13px;border-radius:13px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:700;font-size:.92rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06251a}
.btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.65}
.notice{margin-top:12px;padding:10px 13px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;line-height:1.55;display:flex;gap:9px}
.notice b{color:var(--accent2);white-space:nowrap}
.star{color:var(--accent2);font-size:.85em;flex:none}
.how{padding:12px 15px;font-size:.86rem;line-height:1.75;color:var(--muted);border-top:1px solid var(--line)}
.how b{color:var(--text)}

kbd.k{display:inline-block;min-width:1.65em;padding:0 .38em;margin:0 .08em;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--surface2);font:700 .78em/1.68 system-ui,sans-serif;text-align:center;letter-spacing:0;white-space:nowrap;vertical-align:.05em}
ol.stp,ul.bl{margin:.75em 0;padding:0;list-style:none}
.stp{counter-reset:stp}
.stp>li{counter-increment:stp;position:relative;padding:10px 12px 10px 42px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);line-height:1.75}
.stp>li::before{content:counter(stp);position:absolute;left:11px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:.72em;font-weight:800;display:grid;place-items:center;line-height:1}
.stp>li.sd{opacity:.48;border-color:var(--ok)}
.stp>li.sd::before{content:"✓";background:var(--ok);color:#06251a}
.bl>li{position:relative;margin:.45em 0;padding-left:1.05em}
.bl>li::before{content:"•";position:absolute;left:.1em;color:var(--accent2);font-weight:800}
.keys{margin:10px 0 12px;padding:11px 13px;border-radius:12px;background:color-mix(in srgb,var(--accent2) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line));font-size:.9em}
.keys .t{display:block;font-size:.76em;font-weight:800;letter-spacing:.1em;color:var(--accent2)}
.keys .bl{margin:.25em 0 0!important}
.sumline{margin:6px 0 10px;padding:9px 12px;border-radius:10px;background:var(--surface2);border-left:3px solid var(--accent);font-size:.86em;line-height:1.55}
.sh{margin:1.5em 0 .4em;line-height:1.4}
h2.sh{font-size:1.15em}h3.sh{font-size:1.02em;color:var(--accent2)}h4.sh{font-size:.96em}
.tblw{overflow-x:auto;margin:.9em -4px;border:1px solid var(--line);border-radius:11px;-webkit-overflow-scrolling:touch}
.tblw table{border-collapse:collapse;min-width:100%;font-size:.85em;line-height:1.5}
.tblw th,.tblw td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:4.5em}
.tblw tr:last-child td{border-bottom:0}
.tblw th{background:var(--surface2);white-space:nowrap}
.stamp{font-size:.75rem;color:var(--muted);margin:2px 0 10px}
.lead{margin:6px 0 0;font-size:.9rem;line-height:1.65;opacity:.94}
.quick{display:flex;gap:9px;margin-top:12px}
.quick a{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none}
.quick small{color:var(--muted);font-size:.73rem}
.quick b{font-size:.92rem;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick a.warn{border-color:color-mix(in srgb,var(--accent2) 55%,var(--line))}
.quick a.warn small{color:var(--accent2);font-weight:700}
.row.cinfo{background:color-mix(in srgb,var(--accent2) 8%,var(--surface))}
.row.cinfo .rl{min-height:48px}
.row.cinfo .nm{color:var(--accent2)}
.inf{display:flex;align-items:flex-start;border-top:1px solid var(--line)}
.inf .ib2{flex:1;min-width:0;padding:10px 13px}
.inf .t{display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px}
.inf .en{font-size:.76rem;color:var(--muted)}
.inf .a{font-size:.86rem;line-height:1.58;color:var(--muted);margin-top:3px}
.inf.done .t b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.inf .chk{flex:none;width:48px;align-self:stretch;border:0;background:none;display:grid;place-items:start center;padding-top:12px;color:var(--line)}
.inf .chk span{width:23px;height:23px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.inf .chk svg{width:15px;height:15px;stroke-width:3;opacity:0}
.inf.done .chk span{background:var(--ok);border-color:var(--ok);color:#06251a}
.inf.done .chk svg{opacity:1}

/* ───── 圖鑑／彩蛋／圖示／更新／進度儀表板 ───── */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.ctile{display:flex;flex-direction:column;gap:4px;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;min-width:0;overflow:hidden}
.ctile:active{background:var(--surface2)}
.ctile-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
.ctile-h b{font-size:.96rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctile-h em{font-style:normal;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.ctile-p{font-size:.74rem;color:var(--muted);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctile-bar{height:4px;border-radius:99px;background:var(--surface2);margin-top:4px;overflow:hidden}
.ctile-bar i{display:block;height:100%;background:var(--ok)}
.com-note{margin:0 2px 8px;font-size:.78rem;color:var(--muted)}

.ditem{display:flex;align-items:flex-start;border-top:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 96px;scroll-margin-top:calc(var(--hh) + 64px)}
.ditem:first-child{border-top:0}
.ditem .db{flex:1;min-width:0;padding:11px 13px}
.ditem .dt{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 7px}
.ditem .dt b{font-size:.96rem;line-height:1.35}

function rich(text) {
  const frag = document.createDocumentFragment();
  let bold = false, kbd = false;
  String(text).split(/(\*\*|⟦|⟧)/).forEach(tok => {
    if (tok === "**") { bold = !bold; return; }
    if (tok === "⟦") { kbd = true; return; }
    if (tok === "⟧") { kbd = false; return; }
    if (!tok) return;
    let node = document.createTextNode(tok);
    if (kbd) { const k = h("kbd", { class: "k" }); k.append(node); node = k; }
    if (bold) { const b = document.createElement("strong"); b.append(node); node = b; }
    frag.append(node);
  });
  return frag;
}
const plain = t => String(t).replace(/\*\*|⟦|⟧/g, "");

const IMG_CACHE = "gta6-images-v2";
const imgPaths = list => [...new Set(list.flatMap(m => (m.blocks || []).filter(b => typeof b !== "string").map(b => b.i)))];
async function cachedCount(paths) {
  try { const c = await caches.open(IMG_CACHE); const have = new Set((await c.keys()).map(r => r.url)); return paths.filter(p => have.has(IMG + p)).length; }
  catch (e) { return 0; }
}
async function prefetch(paths, onProgress) {
  if (!navigator.serviceWorker || !navigator.serviceWorker.controller) { toast("離線功能還沒啟用，重新整理一次再試"); return null; }
  if (!navigator.onLine) { toast("目前離線，無法下載"); return null; }
  const c = await caches.open(IMG_CACHE);
  const have = new Set((await c.keys()).map(r => r.url));
  const todo = paths.filter(p => !have.has(IMG + p));
  const queue = todo.slice(), total = todo.length;
  let n = 0, fail = 0; onProgress(0, total);
  const worker = async () => {
    while (queue.length) {
      const p = queue.shift();
      try { await fetch(IMG + p, { mode: "no-cors", referrerPolicy: "no-referrer" }); } catch (e) { fail++; }
      onProgress(++n, total);
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  return { total, fail };
}
function downloadBtn(paths, label, compact) {
  const b = h("button", { class: compact ? "rbtn" : "btn", type: "button" });
  const idle = async () => {
    const have = await cachedCount(paths);
    b.replaceChildren(ico(have >= paths.length ? "check" : "img"),
      have >= paths.length ? (compact ? `圖已存 (${paths.length})` : `圖片已存好（${paths.length} 張），離線可看`)
        : (compact ? `${label} (${have}/${paths.length})` : `${label}（${have} / ${paths.length} 張已存）`));
  };
  b.addEventListener("click", async () => {
    b.disabled = true;
    const r = await prefetch(paths, (d, t) => { b.textContent = t ? `下載中 ${d} / ${t}` : "已經都存好了"; });
    if (r) for (let i = 0; i < 20 && await cachedCount(paths) < paths.length - r.fail; i++) await new Promise(ok => setTimeout(ok, 250));
    b.disabled = false;
    const have = await cachedCount(paths);
    if (r && r.fail) toast(`有 ${r.fail} 張下載失敗，可再按一次重試`);
    else if (r && have < paths.length) toast(`瀏覽器的儲存空間只夠存 ${have} 張，其餘離線時看不到`);
    idle();
  });
  idle();
  return b;
}

  const doneCnt = ch.missions.filter(m => state.done.has(m.id)).length;
  const wrap = h("div", { class: "rb-tl-wrap" },
    h("div", { class: "rb-tl-head" },
      h("div", {}, h("b", { text: `${ch.letter} · ${ch.title}${ch.sub ? " " + ch.sub : ""}` }),
        h("small", { "data-tl-stat": "", text: `${doneCnt} / ${ch.missions.length}` })),
      isDrawer ? h("button", { class: "ib", type: "button", "aria-label": "關閉時間軸", onclick: () => closeTimeline && closeTimeline(), text: "✕" }) : null),
    list);

  return [flags, wrap];
}

function openTimelineDrawer() {
  if (!bookChap) return;
  if (closeTimeline) { closeTimeline(); return; }
  const back = h("div", { class: "rb-back" });
  const drawer = h("aside", { class: "rb-drawer", role: "dialog", "aria-modal": "true", "aria-label": "章節時間軸" },
    ...buildTimelineContent(bookChap, true));
  const onKey = e => { if (e.key === "Escape") close(); };
  function close() {
    back.remove(); drawer.remove(); document.documentElement.classList.remove("lock");
    document.removeEventListener("keydown", onKey); closeTimeline = null;
  }
  back.addEventListener("click", close);
  document.addEventListener("keydown", onKey);
  document.documentElement.classList.add("lock");
  document.body.append(back, drawer);
  closeTimeline = close;
  const curEl = $(".rb-tl-item.is-cur", drawer);
  if (curEl) curEl.scrollIntoView({ block: "center" });
}

function setActiveNode(m) {
  if (!m || (bookCur && bookCur.id === m.id)) return;
  bookCur = m;
  if (bookBar) {
    $(".ncode", bookBar).textContent = m.code;
    $(".rb-name", bookBar).textContent = m.name;
    const prevBtn = $('[data-dir="prev"]', bookBar), nextBtn = $('[data-dir="next"]', bookBar);
    const idx = m.ci - 1;
    prevBtn.disabled = idx === 0 && bookChap.no === G.chapters[0].no;
    nextBtn.disabled = idx === bookChap.missions.length - 1 && bookChap.no === G.chapters[G.chapters.length - 1].no;
  }
  $$(".rb-tl-item").forEach(el => {
    const on = el.dataset.tl === m.id;
    el.classList.toggle("is-cur", on);
    if (on && el.closest(".rb-desktop-rail")) el.scrollIntoView({ block: "nearest" });
  });
}

function jumpToNode(id, opts = {}) {
  const m = byId[id];
  if (!m) return;
  if (!bookChap || m.chap.no !== bookChap.no) {
    location.hash = "#/m/" + enc(id) + (opts.qs || "");
    return;
  }
  const card = document.getElementById("node-" + id);
  if (!card) return;
  spyLockUntil = Date.now() + 700;
  setActiveNode(m);
  let target = card;
  if (opts.md === "s") {
    const det = $("details.rb-steps", card);
    if (det) det.open = true;
  }
  if (opts.k) {
    const byK = $(`[data-k="${opts.k}"]`, card);
    if (byK) {
      const det = byK.closest("details");
      if (det) det.open = true;
      target = byK;
    }
  } else if (opts.p != null) {
    const scope = opts.md === "s" ? ($(".rb-steps-scope", card) || card)
      : opts.md === "p" ? ($(".rb-prose", card) || card) : card;
    const byB = $(`[data-b="${+opts.p}"]`, scope) || $(`[data-b="${+opts.p}"]`, card);
    if (byB) {
      const det = byB.closest("details");
      if (det) det.open = true;
      target = byB;
    }
  }
  target.scrollIntoView({ block: "start", behavior: opts.smooth ? "smooth" : "auto" });
  /* content-visibility:auto 可能在捲動後微調高度，下一幀再校準一次確保精準到位 */
  requestAnimationFrame(() => {
    const rect = target.getBoundingClientRect();
    const topOff = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hh")) || 52) + 46 + 10;
    if (Math.abs(rect.top - topOff) > 40) target.scrollIntoView({ block: "start" });
    if (opts.flash) {
      const fl = target === card ? card : target;
      fl.classList.remove("flash", "flash-card");
      void fl.offsetWidth;
      fl.classList.add(target === card ? "flash-card" : "flash");
    }
  });
}

function stepNode(delta) {
  if (!bookChap || !bookCur) return;
  const idx = bookCur.ci - 1 + delta;
  if (idx >= 0 && idx < bookChap.missions.length) {
    jumpToNode(bookChap.missions[idx].id, { smooth: true });
  } else if (delta < 0 && bookChap.no > 1) {
    const pch = G.chapters.find(c => c.no === bookChap.no - 1);
    if (pch && pch.missions.length) location.hash = "#/m/" + enc(pch.missions[pch.missions.length - 1].id);
  } else if (delta > 0 && bookChap.no < G.chapters.length) {
    const nch = G.chapters.find(c => c.no === bookChap.no + 1);
    if (nch && nch.missions.length) location.hash = "#/m/" + enc(nch.missions[0].id);
  }
}

function syncBookDone(id) {
  const on = state.done.has(id);
  const card = document.getElementById("node-" + id);
  if (card) {
    card.classList.toggle("is-done", on);
    const cb = $(".chkbtn", card);
    if (cb) cb.setAttribute("aria-pressed", String(on));
    const fb = $(".f-done", card);
    if (fb) {
      fb.className = "rbtn f-done" + (on ? " ok" : "");
      fb.replaceChildren(ico("check"), on ? "已完成" : "完成");
    }
  }
  $$(`[data-tl="${id}"]`).forEach(el => el.classList.toggle("is-done", on));
  if (bookChap) {
    const done = bookChap.missions.filter(m => state.done.has(m.id)).length;
    const total = bookChap.missions.length;
    const ovBar = $(".ch-ov .bar>i"); if (ovBar) ovBar.style.width = (done / total * 100).toFixed(1) + "%";
    const ovStat = $("[data-ch-stat]"); if (ovStat) ovStat.textContent = `${done} / ${total}`;
    $$("[data-tl-stat]").forEach(el => { el.textContent = `${done} / ${total}`; });
  }
}

function renderNodeCard(m, opts = {}) {
  const done = state.done.has(m.id);
  const sd = new Set(state.steps[m.id] || []);
  const card = h("article", { class: "rcard" + (done ? " is-done" : "") + (opts.folded ? " is-fold" : ""), id: "node-" + m.id, "data-mid": m.id });

    "aria-label": "收藏任務：" + m.name, onclick: () => {
      if (state.fav.has(m.id)) state.fav.delete(m.id); else state.fav.add(m.id);
      saveFav(); const on = state.fav.has(m.id);
      favBtn.setAttribute("aria-pressed", String(on)); favBtn.textContent = on ? "★" : "☆";
    } }, state.fav.has(m.id) ? "★" : "☆");

    "aria-label": (done ? "取消完成：" : "標記完成：") + m.name, onclick: () => toggleDone(m.id) }, h("span", {}, ico("check")));

  card.append(h("div", { class: "rcard-h" },
    h("span", { class: "ncode", text: m.code }),
    h("div", { class: "rcard-t" }, h("h2", { text: m.name }), subParts.length ? h("div", { class: "rcard-sub", text: subParts.join(" · ") }) : null),
    h("div", { class: "rcard-acts" }, favBtn, chkBtn)));

  if (opts.folded) {
    const fbar = h("div", { class: "spfold-bar" },
      h("span", { text: "尚未推進到此關（同章防雷折疊）" }),
      h("button", { type: "button", text: "展開查看", onclick: () => { card.classList.remove("is-fold"); fbar.remove(); } }));
    card.append(fbar);
  }

  /* 標籤晶片（遊民路書風格） */
  const tags = h("div", { class: "rcard-tags" });
  tags.append(h("span", { class: "rtag t-" + tkey(m.type) }, h("i", { class: "dot" }), m.type));
  if (m.who) {
    const wc = /傑森/.test(m.who) && !/露西亞/.test(m.who) ? " t-who-j" : /露西亞/.test(m.who) && !/傑森/.test(m.who) ? " t-who-l" : "";
    tags.append(h("span", { class: "rtag" + wc, text: m.who }));
  }
  if (m.trophyCount) tags.append(h("span", { class: "rtag t-trophy" }, "獎盃", h("em", { text: String(m.trophyCount) })));
  if (m.hard) tags.append(h("span", { class: "rtag t-hard", text: "常卡" }));
  (m.ytags || []).forEach(t => tags.append(h("span", { class: "rtag", text: t })));
  card.append(tags);

  /* 正文區（無回頭點→摘要→這關前後提醒→重點→一對多→圖文流程→收合/展開逐步清單→常見卡關→私人筆記） */
  const body = h("div", { class: "rcard-b" + (state.stepsOn ? " steps" : "") });
  if (m.ponr && m.chap && m.chap.ponr) {
    body.append(h("div", { class: "ponr-box" },
      h("b", { text: "⚠ 本章無回頭點・開打前請手動存檔" }),
      h("p", {}, rich(m.chap.ponr.note)),
      h("a", { href: `#/checklists?t=miss&ch=${m.chap.no}`, text: "檢查本章會錯過清單 ›" })));
  }
  if (m.sum && !EMPTY_SUM.test(m.sum.trim())) body.append(h("div", { class: "sumline" }, m.sum));
  const todoItems = (m.todo || []).map(id => chkById[id]).filter(Boolean);
  if (todoItems.length) {
    body.append(h("div", { class: "m-todo" },
      h("div", { class: "m-todo-h", text: "這關前後提醒" }),
      todoItems.map(it => renderChkRow(it, { hideJump: true }))));
  }
  if (m.keys && m.keys.length) {
    body.append(h("div", { class: "keys" }, h("b", { class: "t", text: "重點" }),
      h("ul", { class: "bl" }, m.keys.map(k => h("li", {}, rich(k))))));
  }

  /* 一對多連結 */
  if (m.see && byId[m.see]) {
    const targetM = byId[m.see];
    body.append(h("a", { class: "see-banner", href: "#/m/" + enc(targetM.id), onclick: e => {
      if (targetM.chap.no === m.chap.no) { e.preventDefault(); jumpToNode(targetM.id, { smooth: true, flash: true }); }
    } },
      h("span", {}, "圖文併在 ", h("b", { text: `${targetM.code} ${targetM.name}` })),
      h("span", { text: "查看 ›" })));
  }
  if (m.covers && m.covers.length) {
    const bar = h("div", { class: "covers-bar" }, "同時涵蓋：");
    m.covers.forEach(cid => {
      const cm = byId[cid];
      if (!cm) return;
      bar.append(h("a", { href: "#/m/" + enc(cm.id), onclick: e => {
        if (cm.chap.no === m.chap.no) { e.preventDefault(); jumpToNode(cm.id, { smooth: true, flash: true }); }
      }, text: `${cm.code} ${cm.name}` }));
    });
    body.append(bar);
  }

  /* 圖文路書正文 */
  if (m.full) {
    const prose = h("div", { class: "rb-prose" });
    m.blocks.forEach((b, i) => {
      if (typeof b !== "string") { prose.append(mkShot(b, i)); return; }
      const k = hkey(b);
      prose.append(h("p", { "data-b": i, "data-k": k, class: sd.has(k) ? "sd" : null, text: b }));
    });
    body.append(prose);
  }

  /* 逐步清單 */
  let stepCounter = null;
  if (m.walk) {
    const stWrap = h("div", { class: "rb-steps-scope" }, renderBlocks(m.steps, { tap: state.stepsOn, sd }));
    const totalTap = $$("[data-k]", stWrap).length;
    const countDoneSteps = () => $$("[data-k].sd", stWrap).length;
    if (m.full) {
      stepCounter = h("span", { class: "small muted tnum", text: totalTap ? `${countDoneSteps()}/${totalTap}` : "" });
      const det = h("details", { class: "rb-steps" },
        h("summary", {}, h("span", { text: "逐步清單" }),
          h("span", { style: "display:flex;align-items:center;gap:6px" }, stepCounter, ico("next", "chev"))),
        h("div", { class: "rb-st-in" }, stWrap));
      body.append(det);
    } else {
      body.append(stWrap);
    }
  }

  /* 常見卡關 */
  if (m.stuck && m.stuck.length) {
    body.append(h("details", { class: "rb-stuck" },
      h("summary", {}, h("span", { text: `常見卡關 (${m.stuck.length})` }), ico("next", "chev")),
      m.stuck.map(r => h("div", { class: "hit" }, h("b", { text: r.n }), r.k ? h("small", { text: r.k }) : null, r.a ? h("p", {}, rich(r.a)) : null))));
  }

  /* 私人任務筆記區（有記才顯示） */
  const memoSlot = h("div", {});
  const memoBtn = h("button", { class: "rbtn", type: "button", onclick: () => openMemoSheet(m, syncMemo) });
  const syncMemo = () => {
    const txt = state.memos[m.id] || "";
    memoSlot.replaceChildren();
    if (txt) {
      memoSlot.append(h("div", { class: "m-memo" },
        h("div", { class: "m-memo-h" }, h("span", { text: "我的筆記" }),
          h("button", { type: "button", text: "編輯", onclick: () => openMemoSheet(m, syncMemo) })),
        h("div", { class: "m-memo-t", text: txt })));
    }
    memoBtn.className = "rbtn" + (txt ? " ok" : "");
    memoBtn.replaceChildren(ico("memo"), txt ? "筆記 ✓" : "筆記");
  };
  syncMemo();
  body.append(memoSlot);

  const clrBtn = h("button", { class: "rbtn", type: "button", hidden: sd.size ? null : true, text: "清標記", onclick: () => {
    delete state.steps[m.id]; saveSteps();
    $$(".sd", body).forEach(el => el.classList.remove("sd"));
    clrBtn.hidden = true;
    if (stepCounter) {
      const tot = $$(".rb-steps-scope [data-k]", body).length;
      stepCounter.textContent = tot ? `0/${tot}` : "";
    }
  } });

  /* 點段落／步驟標記（存雜湊 data-k） */
  body.addEventListener("click", e => {
    const el = e.target.closest && e.target.closest("[data-k]");
    if (!el || !state.stepsOn || String(getSelection()).length) return;
    if (e.target.closest("a,button,summary")) return;
    const k = el.dataset.k, set = new Set(state.steps[m.id] || []);
    if (set.has(k)) set.delete(k); else set.add(k);
    el.classList.toggle("sd", set.has(k));
    if (set.size) state.steps[m.id] = [...set]; else delete state.steps[m.id];
    saveSteps();
    clrBtn.hidden = !set.size;
    if (stepCounter) {
      const tot = $$(".rb-steps-scope [data-k]", body).length;
      const dcnt = $$(".rb-steps-scope [data-k].sd", body).length;
      stepCounter.textContent = tot ? `${dcnt}/${tot}` : "";
    }
    if (!store.get("hintSteps", false)) { store.set("hintSteps", true); toast("已標記，再點可取消"); }
  });

  card.append(body);

  /* 卡片底部工具列 */
  const foot = h("div", { class: "rcard-f" },
    h("button", { class: "rbtn f-done" + (done ? " ok" : ""), type: "button", onclick: () => toggleDone(m.id) },
      ico("check"), done ? "已完成" : "完成"),
    memoBtn,
    clrBtn);
  const paths = imgPaths([m]);
  if (paths.length) foot.append(downloadBtn(paths, "存圖", true));
  card.append(foot);

  return card;
}

function bookView(no, focusId, q) {
  cleanupBookChrome();
  const ch = G.chapters.find(c => c.no === no) || G.chapters[0];
  if (chapLocked(ch.no)) {
    view.dataset.v = "spgate";
    setTop(`${ch.letter} ${ch.title}`, true);
    tabs("book");
    const mx = maxAllowedChap();
    view.append(renderSpoilGate({
      title: `防雷保護：${ch.title}`,
      desc: `你目前的進度設定為只看到第 ${mx} 章。進入第 ${ch.no} 章可能會看到後續劇情、地點與任務劇透。`,
      backHref: "#/book/" + Math.min(5, Math.max(1, mx)),
      backLabel: `回到第 ${Math.min(5, Math.max(1, mx))} 章`,
      unlockCh: ch.no,
      onPeek: () => { peekChaps.add(ch.no); route(true); },
    }));
    scrollTo(0, 0);
    return;
  }

  bookChap = ch;
  view.dataset.v = "book";
  setTop(`${ch.letter} ${ch.title}${ch.sub ? " · " + ch.sub : ""}`, true);
  tabs("book");

  /* 頂端 sticky 目前節點列 */
  const firstM = (focusId && byId[focusId] && byId[focusId].chap.no === ch.no) ? byId[focusId] : ch.missions[0];
  bookBar = h("div", { class: "rb-bar", role: "region", "aria-label": "路書節點導覽" },
    h("button", { class: "rb-cur", type: "button", onclick: openTimelineDrawer, "aria-label": "展開章節時間軸" },
      ico("toc"), h("span", { class: "ncode", text: firstM ? firstM.code : ch.letter }),
      h("span", { class: "rb-name", text: firstM ? firstM.name : ch.title }),
      h("span", { class: "rb-hint", text: "▾" })),
    h("button", { class: "rb-navbtn", type: "button", "data-dir": "prev", "aria-label": "上一個節點", onclick: () => stepNode(-1) }, ico("back")),
    h("button", { class: "rb-navbtn", type: "button", "data-dir": "next", "aria-label": "下一個節點", onclick: () => stepNode(1) }, ico("next")));
  document.body.append(bookBar);

  /* 桌機寬螢幕左側常駐深色時間軸 */
  bookRail = h("aside", { class: "rb-desktop-rail", "aria-label": "路書時間軸" }, ...buildTimelineContent(ch, false));
  document.body.append(bookRail);

  /* 本章概況卡 */
  const done = ch.missions.filter(m => state.done.has(m.id)).length;
  const chImgs = imgPaths(ch.missions);
  const chChks = chkByChap[ch.no] ? chkByChap[ch.no].items : [];
  const chCodesCnt = allCodes.filter(c => c.ch === ch.no).length;

  const ov = h("section", { class: "ch-ov" },
    h("div", { class: "ch-ov-top" },
      h("div", { class: "ch-ov-row" },
        h("span", { class: "ch-flag-big", text: ch.letter }),
        h("div", {}, h("h1", { text: `${ch.title}${ch.sub ? "　" + ch.sub : ""}` }),

  const ovBody = h("div", { class: "ch-ov-body" });
  if (ch.lead) ovBody.append(h("p", { class: "lead" }, rich(ch.lead)));
  if (chChks.length) {
    const left = chChks.filter(x => !state.ticks.has(x.id)).length;
    const mLeft = chChks.filter(x => x.cat === "miss" && !state.ticks.has(x.id)).length;
    const sumEl = h("span", { "data-ov-chk": "",

  const acts = h("div", { class: "ch-ov-acts" },

    chCodesCnt ? h("a", { class: "rbtn", href: "#/codes?ch=" + ch.no }, ico("key"), `本章密碼 (${chCodesCnt})`) : null,
    chImgs.length ? downloadBtn(chImgs, "離線截圖", true) : null);
  ovBody.append(acts);
  ov.append(ovBody);
  view.append(ov);
  prog.hidden = false;

  /* 連續渲染本章所有路書節點卡（若開啟同章防雷，進度後 2 關以上先折疊） */
  const foldOn = state.spoilInner && ch.no === maxAllowedChap();
  const firstTodoIdx = foldOn ? ch.missions.findIndex(m => !state.done.has(m.id)) : -1;
  const frag = document.createDocumentFragment();
  bookCards = [];
  ch.missions.forEach((m, idx) => {
    const folded = foldOn && firstTodoIdx >= 0 && idx > firstTodoIdx + 2 && m.id !== focusId && !state.done.has(m.id);
    const el = renderNodeCard(m, { folded });
    bookCards.push({ m, el });
    frag.append(el);
  });
  view.append(frag);

  /* 章末前後章導覽 */
  const prevCh = G.chapters.find(c => c.no === ch.no - 1);
  const nextCh = G.chapters.find(c => c.no === ch.no + 1);
  view.append(h("div", { class: "cta" },
    prevCh ? h("a", { class: "btn", href: "#/book/" + prevCh.no }, ico("back"), `${prevCh.letter} ${prevCh.title}`) : null,
    nextCh ? h("a", { class: "btn pri", href: "#/book/" + nextCh.no },
      `${nextCh.letter} ${nextCh.title}${chapLocked(nextCh.no) ? "（防雷鎖定）" : ""}`, ico("next")) : null));

  setActiveNode(firstM);

  /* 捲動定位 */
  const p = q ? q.get("p") : null;
  const md = q ? q.get("md") : null;
  if (focusId && byId[focusId]) {
    const resume = p == null && state.pos && state.pos.id === focusId && state.pos.b > 0;
    requestAnimationFrame(() => {
      if (p != null) {
        jumpToNode(focusId, { p, md, flash: true });
      } else if (resume) {
        jumpToNode(focusId, { k: state.pos.k, p: state.pos.b, md: state.pos.md });
        toast("已回到上次位置", "節點開頭", () => jumpToNode(focusId, { smooth: true }));

function updateBookSpy() {
  if (view.dataset.v !== "book" || !bookCards.length) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  prog.style.width = (max > 0 ? Math.min(1, scrollY / max) * 100 : 0) + "%";
  if (Date.now() < spyLockUntil) return;
  const line = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hh")) || 52) + 46 + 24;
  let active = bookCards[0].m;
  for (let i = 0; i < bookCards.length; i++) {
    const top = bookCards[i].el.getBoundingClientRect().top;
    if (top <= line) active = bookCards[i].m;
    else break;
  }
  setActiveNode(active);
}

      h("button", { class: "chip", type: "button", "data-sort": "default", "aria-pressed": "true", text: "預設",
        onclick: () => { curSort = "default"; draw(); } }),
      ...statKeys.map(sk => h("button", { class: "chip", type: "button", "data-sort": sk, "aria-pressed": "false", text: sk,
        onclick: () => { curSort = sk; draw(); } })));
    view.append(sortChips);
  }

  const listCard = h("div", { class: "card" });
  view.append(headerStat, listCard);

  const draw = () => {
    $$("[data-sub]", chips).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sub === curSub)));
    if (sortChips) $$("[data-sort]", sortChips).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sort === curSort)));
    const terms = norm(kw).split(/\s+/).filter(Boolean);
    let arr = items.filter(it => {
      if (curSub !== "all" && it.cat !== curSub) return false;
      if (onlyLeft && it.id && (isMiss ? state.ticks.has(it.id) : state.col.has(it.id))) return false;
      if (terms.length) {
        const hay = norm([it.n, it.en, it.cat, it.where, it.a, it.how, it.val, it.code, (it.tags || []).join(" ")].filter(Boolean).join(" "));
        if (!terms.every(t => hay.includes(t))) return false;
      }
      return true;
    });
    if (curSort !== "default") {
      arr = arr.slice().sort((a, b) => ((b.st && b.st[curSort]) || -1) - ((a.st && a.st[curSort]) || -1));
    }
    updateHead(arr.length);
    listCard.replaceChildren();
    if (!arr.length) { listCard.append(h("div", { class: "empty", text: "沒有符合的項目" })); return; }

    const frag = document.createDocumentFragment();
    arr.forEach(it => {
      const checked = !!(it.id && (isMiss ? state.ticks.has(it.id) : state.col.has(it.id)));
      const row = h("div", { class: "ditem" + (checked ? " done" : ""), "data-cid": it.id || "" });

      if ((isCol || isMiss) && it.id) {
        const btn = h("button", { class: "chk", type: "button", "aria-pressed": String(checked), "aria-label": "已收集：" + it.n,
          onclick: () => {
            const set = isMiss ? state.ticks : state.col;
            if (set.has(it.id)) set.delete(it.id); else set.add(it.id);
            isMiss ? saveTicks() : saveCol();
            const on = set.has(it.id);
            row.classList.toggle("done", on); btn.setAttribute("aria-pressed", String(on));
            updateHead(arr.length);
          } }, h("span", {}, ico("check")));
        row.append(btn);
      }

      const db = h("div", { class: "db" },
        h("div", { class: "dt" }, h("b", { text: it.n }), it.en ? h("span", { class: "den", text: it.en }) : null));

      const tgs = [];
      if (it.cat) tgs.push(h("span", { class: "dtag", text: it.cat }));
      if (it.where) tgs.push(h("span", { class: "dtag", text: it.where }));
      if (it.price) tgs.push(h("span", { class: "dtag price", text: it.price }));
      if (it.ed) tgs.push(h("span", { class: "dtag ed", text: it.ed }));
      if (it.val) tgs.push(h("span", { class: "dtag gift", text: it.val }));
      if (it.gift) tgs.push(h("span", { class: "dtag gift", text: it.gift }));
      (it.tags || []).forEach(tg => tgs.push(h("span", { class: "dtag", text: tg })));
      if (tgs.length) db.append(h("div", { class: "dtags" }, tgs));

      if (it.code) db.append(h("div", { class: "cheat-code", text: it.code }));
      if (it.a) db.append(h("div", { class: "da" }, rich(it.a)));
      if (it.how) db.append(h("div", { class: "da muted" }, rich(it.how)));

      /* 載具／武器數值評分條（10 分制畫進度條，其餘評級／彈匣排成精簡晶片） */
      if (it.st) {
        const bars = [], extras = [];
        Object.entries(it.st).forEach(([k, v]) => {
          if (typeof v === "number" && v <= 10 && !/評級|彈匣/.test(k)) bars.push([k, v]);
          else extras.push([k, v]);
        });
        if (bars.length) {
          db.append(h("div", { class: "stat-grid" }, bars.map(([k, v]) => h("div", { class: "srow" },
            h("span", { class: "sl", text: k }),
            h("span", { class: "sb" }, h("i", { style: "width:" + Math.min(100, v * 10) + "%" })),
            h("span", { class: "sv", text: String(v) })))));
        }
        if (extras.length) {
          db.append(h("div", { class: "smeta" }, extras.map(([k, v]) => h("span", { text: `${k.replace("評級", "")} ${v}` }))));
        }
      }

      const links = [];
      if (isStory && it.id && it.id.startsWith("story.")) {
        const mid = "p-" + it.id.slice(6);
        if (byId[mid]) links.push(h("a", { href: "#/m/" + enc(mid), text: `路書 ${byId[mid].code} ›` }));
      }
      if (it.map) links.push(h("a", { href: it.map, target: "_blank", rel: "noopener noreferrer", text: "地圖 ↗" }));
      if (links.length) db.append(h("div", { class: "dlinks" }, links));

      row.append(db);
      frag.append(row);
    });
    listCard.append(frag);
  };

  let tmr = 0;
  searchInput.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(() => { kw = searchInput.value; draw(); }, 140); });
  draw();

  const hl = q.get("hl");
  if (hl) requestAnimationFrame(() => {
    const el = $(`[data-cid="${CSS.escape(hl)}"]`, listCard);
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); }
  });
}

    out.replaceChildren();

        if (curCat !== "all" && it.cat !== curCat) return false;

        if (terms.length) {
          const hay = norm([grp.region, it.n, it.en, it.cat, it.gift, it.a].filter(Boolean).join(" "));

      list.forEach(it => {
        const checked = !!(it.id && state.col.has(it.id));
        const row = h("div", { class: "ditem" + (checked ? " done" : ""), "data-cid": it.id || "" });
        if (it.id) {
          const btn = h("button", { class: "chk", type: "button", "aria-pressed": String(checked), "aria-label": "已發現：" + it.n,
            onclick: () => {
              if (state.col.has(it.id)) state.col.delete(it.id); else state.col.add(it.id);

/* ───── 保險箱與門鎖密碼速查（#/codes） ───── */
function codesView(q) {
  setTop("保險箱與門鎖密碼", true); tabs("wiki");
  const qCh = q.get("ch");
  let curCh = ["1", "2", "3", "all"].includes(qCh) ? qCh : (isSpoilOn() ? String(Math.min(3, maxAllowedChap())) : "all");
  let curCat = "all", onlyLeft = false, kw = "";

  const searchInput = h("input", { type: "search", placeholder: "篩選地點、任務或密碼…", autocomplete: "off", "aria-label": "篩選密碼" });
  view.append(h("div", { class: "sbox", style: "margin-bottom:8px" }, ico("search"), searchInput));

  const chChips = h("div", { class: "chips", role: "tablist", "aria-label": "章節篩選" });
  const catChips = h("div", { class: "chips", style: "padding-top:0" },
    [["all", "全部"], ["fixed", "主線固定"], ["據點", "據點"], ["探索", "探索"]].map(([k, l]) =>
      h("button", { class: "chip", type: "button", "data-cc": k, "aria-pressed": String(curCat === k), text: l,
        onclick: () => { curCat = k; draw(); } })),
    h("button", { class: "chip", type: "button", "aria-pressed": "false", text: "未開過",
      onclick: e => { onlyLeft = !onlyLeft; e.currentTarget.setAttribute("aria-pressed", String(onlyLeft)); draw(); } }));
  const statEl = h("div", { class: "small muted tnum", style: "margin:0 2px 8px" });
  const out = h("div", {});
  view.append(chChips, catChips, statEl, out);

  const rebuildChChips = () => {
    chChips.replaceChildren();
    [1, 2, 3].forEach(c => {
      const locked = chapLocked(c);
      const cnt = allCodes.filter(x => x.ch === c).length;
      chChips.append(h("button", { class: "chip", type: "button", role: "tab", "data-cch": String(c),
        "aria-pressed": String(curCh === String(c)),
        onclick: () => { curCh = String(c); history.replaceState(null, "", "#/codes?ch=" + c); draw(); } },
        locked ? `🔒 第${c}章` : `第${c}章`, locked ? null : h("small", { text: String(cnt) })));
    });
    const visCnt = allCodes.filter(x => !chapLocked(x.ch)).length;
    chChips.append(h("button", { class: "chip", type: "button", role: "tab", "data-cch": "all",
      "aria-pressed": String(curCh === "all"),
      onclick: () => { curCh = "all"; history.replaceState(null, "", "#/codes?ch=all"); draw(); } },
      "全部", h("small", { text: String(visCnt) })));
  };

  const draw = () => {
    rebuildChChips();
    $$("[data-cc]", catChips).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cc === curCat)));
    out.replaceChildren();

    if (curCh !== "all" && chapLocked(+curCh)) {
      statEl.textContent = "";
      const mx = Math.min(3, Math.max(1, maxAllowedChap()));
      out.append(renderSpoilGate({
        title: `防雷保護：第 ${curCh} 章密碼`,
        desc: `你目前設定只看到第 ${maxAllowedChap()} 章。第 ${curCh} 章的保險箱與門鎖名稱可能透漏後續任務與地點。`,
        backHref: "#/codes?ch=" + mx,
        backLabel: `看第 ${mx} 章密碼`,
        unlockCh: +curCh,
        onPeek: () => { peekChaps.add(+curCh); draw(); },
      }));
      return;
    }

    const terms = norm(kw).split(/\s+/).filter(Boolean);
    const pool = curCh === "all" ? allCodes.filter(x => !chapLocked(x.ch)) : allCodes.filter(x => x.ch === +curCh);
    const hiddenCnt = curCh === "all" ? allCodes.length - pool.length : 0;
    const arr = pool.filter(it => {
      if (curCat === "fixed" && !it.fixed) return false;
      if (curCat !== "all" && curCat !== "fixed" && it.cat !== curCat) return false;
      if (onlyLeft && state.col.has(it.id)) return false;
      if (terms.length) {
        const hay = norm([it.code, it.name, it.where, it.note, it.cat].filter(Boolean).join(" "));
        if (!terms.every(t => hay.includes(t))) return false;
      }
      return true;
    });

    const opened = pool.filter(x => state.col.has(x.id)).length;
    statEl.textContent = `已開過 ${opened} / ${pool.length}` + (arr.length < pool.length ? `・顯示 ${arr.length}` : "");

    if (!arr.length) {
      out.append(h("div", { class: "empty", text: "沒有符合的密碼項目" }));
    } else {
      const card = h("div", { class: "card" });
      arr.forEach(it => {
        const checked = state.col.has(it.id);
        const row = h("div", { class: "ditem" + (checked ? " done" : ""), "data-cid": it.id });
        const btn = h("button", { class: "chk", type: "button", "aria-pressed": String(checked), "aria-label": "已開過：" + it.name,
          onclick: () => {
            if (state.col.has(it.id)) state.col.delete(it.id); else state.col.add(it.id);
            saveCol(); const on = state.col.has(it.id);
            row.classList.toggle("done", on); btn.setAttribute("aria-pressed", String(on));
            const op = pool.filter(x => state.col.has(x.id)).length;
            statEl.textContent = `已開過 ${op} / ${pool.length}` + (arr.length < pool.length ? `・顯示 ${arr.length}` : "");
            if (onlyLeft && on) draw();
          } }, h("span", {}, ico("check")));
        const pin = h("button", { class: "code-pin", type: "button", title: "點一下複製密碼", text: it.code,
          onclick: async () => {
            try { await navigator.clipboard.writeText(it.code); toast(`已複製密碼 ${it.code}`); }
            catch (e) { toast(`密碼：${it.code}`); }
          } });
        const tgs = [
          h("span", { class: "dtag" + (it.fixed ? " gift" : ""), text: it.fixed ? "主線固定" : "據點／探索" }),
          h("span", { class: "dtag", text: `第 ${it.ch} 章` }),
        ];
        if (it.where) tgs.push(h("span", { class: "dtag", text: it.where }));
        const m = it.m && byId[it.m];
        row.append(btn, h("div", { class: "db" },
          h("div", { class: "dt" }, h("b", { text: it.name })),
          h("div", { style: "margin:4px 0" }, pin),
          h("div", { class: "dtags" }, tgs),
          it.note ? h("div", { class: "da" }, rich(it.note)) : null,
          m ? h("div", { class: "dlinks" }, h("a", { href: "#/m/" + enc(m.id), text: `路書 ${m.code} ${m.name} ›` })) : null));
        card.append(row);
      });
      out.append(card);
    }

    if (hiddenCnt > 0) {
      out.append(renderSpoilBar(`防雷中：已隱藏後續章節 ${hiddenCnt} 組密碼`, "調整 ›", openSpoilerSheet));
    }
  };

  let tmr = 0;
  searchInput.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(() => { kw = searchInput.value; draw(); }, 140); });
  draw();

  const hl = q.get("hl");
  if (hl) requestAnimationFrame(() => {
    const el = $(`[data-cid="${CSS.escape(hl)}"]`, out);
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); }
  });
}

/* ───── 清單總中心（#/checklists、#/progress、#/index） ───── */
const filt = { type: "all", hideDone: false };
function checklistsView(q, defaultTab) {
  setTop("清單", false); tabs("chk");
  let tab = q.get("t") || defaultTab || "chap";
  if (!["chap", "miss", "trophy", "progress"].includes(tab)) tab = "chap";
  const qCh = q.get("ch");
  let selCh = ["1", "2", "3", "4", "5", "0", "all"].includes(qCh) ? qCh : (isSpoilOn() ? String(maxAllowedChap()) : "all");
  let onlyLeft = false;

  const isSelChLocked = cs => cs === "all" ? false : cs === "0" ? (isSpoilOn() && !peekChaps.has(6)) : chapLocked(+cs);
  const syncUrl = () => {
    const ps = new URLSearchParams();
    if (tab !== "chap") ps.set("t", tab);
    if ((tab === "chap" || tab === "miss") && selCh) ps.set("ch", selCh);
    const qs = ps.toString();

              ctl = h("div", { class: "pctl" },

              const jump = r.id === "main" ? "#/" : r.id === "egg" ? "#/eggs" : r.id === "miss" ? "#/checklists?t=miss"
                : r.id === "car" ? "#/codex/vehicle" : r.id === "gun" ? "#/codex/weapon" : r.id === "animal" ? "#/codex/animal"

            rowEl.append(h("div", { class: "pt" }, h("b", { text: r.name }), subTxt ? h("small", { text: subTxt }) : null, h("div", { class: "pbar" }, barI)),
              numEl, ctl);
            card.append(rowEl);
          });
          pWrap.append(card);
        });
      };
      drawProg();
    }
  }
  renderTab();
}

/* ───── 全文搜尋（#/search） ───── */
let haystack = null, codexIndexed = false;
const compactQ = s => s.replace(/(?<=\d),(?=\d)/g, "").replace(/(\d)\s+([萬千百億])/g, "$1$2");
function buildIndex() {
  const push = (e, t, pri) => { e.t = t; e.q = norm(t); e.qc = compactQ(e.q); e.pri = pri || 0; haystack.push(e); };   // q＝正規化文字（別用 n）
  if (!haystack) {
    haystack = [];
    allChks.forEach(it => {
      const g = chkByChap[it.ch];
      push({ k: "chk", g: "chk", ch: it.ch === 0 ? 6 : it.ch, it, chTitle: g ? g.title : "" },
        [it.title, it.note, CHK_CATS[it.cat] || "", g ? g.title : ""].filter(Boolean).map(plain).join(" "), 5);
    });
    allCodes.forEach(it => {
      push({ k: "code", g: "o", ch: it.ch, it },
        [it.code, it.name, it.where, it.note, it.cat].filter(Boolean).map(plain).join(" "), 4);
    });
    missions.forEach(m => {
      const ch = m.chap.no;
      push({ k: "m", g: "m", ch, m, b: null }, [m.code, m.name, m.aka, m.en, m.note, m.sum, m.who].filter(Boolean).join(" "), 4);
      (m.keys || []).forEach(t => push({ k: "m", g: "m", ch, m, b: null, md: "s" }, plain(t), 1));
      textBlocks(m.steps).forEach(x => push({ k: "m", g: "m", ch, m, b: x.i, md: "s" }, x.t));
      (m.blocks || []).forEach((b, i) => { if (typeof b === "string") push({ k: "m", g: "m", ch, m, b: i, md: "p" }, b); });
      (m.stuck || []).forEach(r => push({ k: "m", g: "m", ch, m, b: null, md: "s", sub: "常見卡關" }, [r.n, r.a].filter(Boolean).map(plain).join("："), 1));
    });
    G.chapters.forEach(ch => (ch.info || []).forEach((sec, si) => sec.rows.forEach((r, ri) =>
      push({ k: "r", g: "o", ch: ch.no, chObj: ch, sec, si, ri }, [r.n, r.en, r.k, r.a].filter(Boolean).map(plain).join(" "), 2))));
    (G.notes || []).forEach(n => {
      const ch = n.minCh || 0;
      push({ k: "n", g: "n", ch, n, b: null }, n.title + " " + (n.sub || ""), 3);
      textBlocks(n.blocks).forEach(x => push({ k: "n", g: "n", ch, n, b: x.i }, x.t));
    });
  }
  if (!codexIndexed && window.CODEX) {
    codexIndexed = true;
    const C = window.CODEX;
    const catName = Object.fromEntries(C.groups.flatMap(g => g.cats).map(c => [c.slug, c.name]));
    Object.entries(C.cards || {}).forEach(([slug, items]) => {
      if (slug === "story") return;
      const cn = catName[slug] || slug;
      const ch = slug === "cheat" ? 6 : slug === "miss" ? 5 : 0;
      items.forEach(it => push({ k: "c", g: "c", ch, slug, cn, it },
        [it.n, it.en, it.cat, it.where, it.val, it.gift, it.code, it.a, it.how, (it.tags || []).join(" ")].filter(Boolean).map(plain).join(" "), 3));
    });
    (C.eggs || []).forEach(grp => grp.items.forEach(it =>
      push({ k: "e", g: "c", ch: 0, reg: grp.region, it }, [grp.region, it.n, it.en, it.cat, it.gift, it.a].filter(Boolean).map(plain).join(" "), 3)));
    (C.hud || []).forEach(grp => grp.items.forEach(it =>
      push({ k: "h", g: "o", ch: 0, title: grp.title, it }, [grp.title, it.n, it.say, it.do].filter(Boolean).map(plain).join(" "), 2)));
    (C.updates || []).forEach(day => day.items.forEach(it =>
      push({ k: "u", g: "o", ch: 0, date: day.date, it }, [day.date, it.tag, it.text].filter(Boolean).map(plain).join(" "), 1)));
  }
}

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return;
    toast("攻略已更新到新版本", "重新整理", () => { reloading = true; location.reload(); });
  });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(err => console.warn("離線功能啟用失敗", err));
}
})();
</script>
