<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GTA 6 全任務攻略</title>
<meta name="description" content="GTA 6 全任務攻略：分章節閱讀、任務索引、獎盃、搜尋（個人使用）">
<meta name="theme-color" content="#14101f">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GTA6 攻略">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
/* 畫面出現前先套用主題與字級，避免閃一下 */
try {
  var t = JSON.parse(localStorage.getItem("gta6.theme"));
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  var f = JSON.parse(localStorage.getItem("gta6.fs"));
  if (f >= 14 && f <= 26) document.documentElement.style.setProperty("--fs", f + "px");
} catch (e) {}
</script>
<style>
:root{
  --bg:#14101f; --surface:#1e1830; --surface2:#2a2142; --line:#392d57;
  --text:#ece8f5; --muted:#a59cbd; --accent:#ff4f9a; --accent2:#ff9a3c; --ok:#3ddc97;
  --on-accent:#fff; --shadow:0 8px 28px rgba(0,0,0,.45);
  --fs:17px; --hh:calc(52px + env(safe-area-inset-top)); --nh:calc(58px + env(safe-area-inset-bottom));
  --b-main:#ff4f9a; --b-side:#34d1c0; --b-heist:#ff7a45; --b-stranger:#a98bff; --b-opt:#f2c94c; --b-extra:#8e87a6;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    --bg:#faf7f5; --surface:#fff; --surface2:#f3edf0; --line:#e5dce2;
    --text:#231b2e; --muted:#6d6479; --accent:#d6246e; --accent2:#d96a0b; --ok:#0f8f5a;
    --shadow:0 8px 28px rgba(60,30,60,.18);
    --b-main:#d6246e; --b-side:#0f8f86; --b-heist:#c94f1c; --b-stranger:#6b4fd0; --b-opt:#a37a00; --b-extra:#6d6479;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#faf7f5; --surface:#fff; --surface2:#f3edf0; --line:#e5dce2;
  --text:#231b2e; --muted:#6d6479; --accent:#d6246e; --accent2:#d96a0b; --ok:#0f8f5a;
  --shadow:0 8px 28px rgba(60,30,60,.18);
  --b-main:#d6246e; --b-side:#0f8f86; --b-heist:#c94f1c; --b-stranger:#6b4fd0; --b-opt:#a37a00; --b-extra:#6d6479;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  line-height:1.6;overflow-wrap:anywhere}
html.lock,html.lock body{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 頂欄 */
.top{position:fixed;inset:0 0 auto 0;z-index:30;height:var(--hh);padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .tt{flex:1;min-width:0;text-align:center;font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:12px}
.ib:active{background:var(--surface2)}
.ib[hidden]{display:block;visibility:hidden}
.ib.aa{font-weight:800;font-size:1.02rem;letter-spacing:-.02em}
#prog{position:fixed;z-index:31;left:0;top:var(--hh);height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .08s linear}
#offline{position:fixed;z-index:29;left:0;right:0;top:var(--hh);padding:6px 14px;font-size:.82rem;text-align:center;background:var(--accent2);color:#1a1020;font-weight:600}
#offline[hidden]{display:none}

main{padding:calc(var(--hh) + 14px) max(16px,env(safe-area-inset-right)) calc(var(--nh) + 28px) max(16px,env(safe-area-inset-left));max-width:760px;margin:0 auto;min-height:100dvh}

/* 底部導覽 */
.nav{position:fixed;inset:auto 0 0 0;z-index:30;height:var(--nh);padding:0 max(6px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(6px,env(safe-area-inset-left));
  display:flex;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav a,.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;
  text-decoration:none;font-size:.72rem;color:var(--muted);min-width:0;border-radius:12px}
.nav a[aria-current="page"]{color:var(--accent)}
.nav .dis{opacity:.35;pointer-events:none}
.nav .mid{flex:1.4;color:var(--text);font-weight:700}
.nav .mid span.s{font-weight:500;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}

/* 首頁 */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 20px 18px;color:#fff;
  background:linear-gradient(140deg,#2c0f55 0%,#b02a78 58%,#ff8a3d 100%);box-shadow:var(--shadow)}
.hero .eyebrow{font-size:.74rem;letter-spacing:.18em;font-weight:700;opacity:.85}
.hero h1{margin:4px 0 14px;font-size:1.55rem;line-height:1.25}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:#fff;width:0;transition:width .3s}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.84rem;opacity:.95}
.cont{display:block;margin:14px 0 0;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.cont small{display:block;color:var(--muted);font-size:.76rem}
.cont strong{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:1.05rem;margin-top:2px}
.cont .go{color:var(--accent);font-size:.9rem;white-space:nowrap}
.cont .mini{height:4px;border-radius:9px;background:var(--surface2);margin-top:10px;overflow:hidden}
.cont .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}

details.chap{margin-top:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:clip}
details.chap>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 14px 14px 16px;cursor:pointer;min-height:56px}
details.chap>summary::-webkit-details-marker{display:none}
details.chap .ct{flex:1;min-width:0}
details.chap .ct b{display:block;font-size:1.04rem}
details.chap .ct small{color:var(--muted);font-size:.8rem}
details.chap .cn{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
details.chap .chev{transition:transform .2s;color:var(--muted)}
details.chap[open] .chev{transform:rotate(90deg)}
details.chap .cb{height:3px;background:var(--surface2)}
details.chap .cb i{display:block;height:100%;background:var(--ok);width:0}

.row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.row .rl{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:11px 4px 11px 14px;text-decoration:none;min-height:56px}
.row:active{background:var(--surface2)}
.row .num{width:2.1em;flex:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{font-weight:650;line-height:1.35;display:flex;align-items:center;gap:6px}
.row .nm svg{width:14px;height:14px;color:var(--accent2);flex:none}
.row .nt{font-size:.8rem;color:var(--muted);line-height:1.4;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.sumonly .nm{font-weight:550}
.row.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.row.cur{box-shadow:inset 3px 0 0 var(--accent)}
.row .chk{flex:none;width:52px;border:0;background:none;display:grid;place-items:center;color:var(--line)}
.row .chk span{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.row .chk svg{width:16px;height:16px;stroke-width:3;opacity:0}
.row.done .chk span{background:var(--ok);border-color:var(--ok);color:#06251a}
.row.done .chk svg{opacity:1}
.badge{flex:none;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid currentColor;line-height:1.4;white-space:nowrap}
.b-main{color:var(--b-main)}.b-side{color:var(--b-side)}.b-heist{color:var(--b-heist)}
.b-stranger{color:var(--b-stranger)}.b-opt{color:var(--b-opt)}.b-extra{color:var(--b-extra)}
.who{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.who.j{color:var(--b-side)}.who.l{color:var(--b-main)}

.sect{margin:26px 2px 8px;font-size:.78rem;letter-spacing:.12em;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.card{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:clip}
.pad{padding:14px 16px}
.pad p{margin:.5em 0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.foot{margin:28px 4px 0;color:var(--muted);font-size:.78rem;line-height:1.7}
.foot a{color:var(--accent)}

/* 索引 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:.86rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.chip small{opacity:.7;margin-left:3px}
.sub{padding:8px 14px;font-size:.78rem;color:var(--muted);background:var(--surface2);border-top:1px solid var(--line);font-weight:650}
.sub:first-child{border-top:0}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.hit{display:block;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none}
.hit:first-child{border-top:0}
.hit b{display:block}
.hit small{display:block;color:var(--muted);font-size:.74rem}
.hit p{margin:3px 0 0;font-size:.88rem;line-height:1.5;color:var(--text);opacity:.9}
mark{background:color-mix(in srgb,var(--accent2) 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.sbox{position:sticky;top:calc(var(--hh) + 6px);z-index:5;display:flex;gap:8px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.sbox input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-size:1rem;outline:none}
.sbox svg{color:var(--muted)}

/* 閱讀 */
.art{font-size:var(--fs);line-height:1.85;letter-spacing:.015em}
.art .kick{font-size:.78rem;color:var(--muted);letter-spacing:.06em;font-weight:650}
.art h1{margin:4px 0 8px;font-size:1.55em;line-height:1.3}
.art .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.8rem;color:var(--muted)}
.art .sum{margin:14px 0 4px;padding:11px 14px;border-radius:12px;background:var(--surface);border-left:3px solid var(--accent);font-size:.9em;line-height:1.65}
.art .sum b{color:var(--accent);font-size:.82em;letter-spacing:.08em}
.art p{margin:1.05em 0}
.art p.flash,.art figure.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,35%{background:color-mix(in srgb,var(--accent2) 38%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent2) 38%,transparent);border-radius:6px}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
.art [data-b]{scroll-margin-top:calc(var(--hh) + 14px)}
.shot{margin:1em -4px;border-radius:12px;overflow:hidden;background:var(--surface2);aspect-ratio:var(--ar,16/9);display:grid;place-items:center;position:relative}
.shot.ok{aspect-ratio:var(--ar,auto);display:block}
.shot img{display:block;width:100%;height:auto;cursor:zoom-in}
.shot.loading::after{content:"";width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;position:absolute}
@keyframes sp{to{transform:rotate(1turn)}}
.imgbtn{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:10px;padding:10px 14px;font-size:.82rem}
.cta{display:flex;gap:10px;margin:30px 0 8px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:700;font-size:.95rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06251a}
.btn:active{filter:brightness(.92)}
.nosteps{margin-top:18px;padding:18px 16px;border-radius:16px;border:1px dashed var(--line);background:var(--surface);font-size:.95em;line-height:1.7}
.nosteps b{display:block;margin-bottom:4px}

.art.steps p[data-k]{cursor:pointer;transition:opacity .15s}
.art p.sd{opacity:.45;box-shadow:inset 3px 0 0 var(--ok);padding-left:11px;margin-left:-11px}
.art .bl>li.sd{opacity:.45}
.notice{margin-top:14px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;line-height:1.6;display:flex;gap:10px}
.notice b{color:var(--accent2);white-space:nowrap}
.star{color:var(--accent2);font-size:.85em;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:2px 11px;font-size:.8rem;min-height:30px}
.pill[aria-pressed="true"]{color:var(--accent2);border-color:var(--accent2);font-weight:700}
.btn:disabled{opacity:.7}
.how{padding:12px 16px;font-size:.86rem;line-height:1.75;color:var(--muted);border-top:1px solid var(--line)}
.how b{color:var(--text)}

/* 內文：行內標記、步驟、重點、表格 */
kbd.k{display:inline-block;min-width:1.7em;padding:0 .4em;margin:0 .1em;border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;background:var(--surface2);font:700 .78em/1.7 system-ui,sans-serif;text-align:center;letter-spacing:0;white-space:nowrap;vertical-align:.05em}
.art ol.stp,.art ul.bl{margin:.9em 0;padding:0;list-style:none}
.stp{counter-reset:stp}
.stp>li{counter-increment:stp;position:relative;padding:12px 13px 12px 46px;margin:10px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);line-height:1.8}
.stp>li::before{content:counter(stp);position:absolute;left:13px;top:13px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:.74em;font-weight:800;display:grid;place-items:center;line-height:1}
.art.steps .stp>li,.art.steps ul.bl>li{cursor:pointer}
.stp>li.sd{opacity:.5;border-color:var(--ok);box-shadow:none;margin-left:0;padding-left:46px}
.stp>li.sd::before{content:"✓";background:var(--ok);color:#06251a}
.bl>li{position:relative;margin:.5em 0;padding-left:1.1em}
.bl>li::before{content:"•";position:absolute;left:.1em;color:var(--accent2);font-weight:800}
.keys{margin:14px 0 6px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent2) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent2) 40%,var(--line));font-size:.92em}
.keys .t{display:block;font-size:.8em;font-weight:800;letter-spacing:.12em;color:var(--accent2)}
.keys .bl{margin:.3em 0 0!important}
.seg.full{display:flex;margin:16px 0 4px}
.seg.full button{flex:1;padding:10px 6px}
.art .sh{margin:1.7em 0 .4em;line-height:1.4}
.art h2.sh{font-size:1.18em}.art h3.sh{font-size:1.05em;color:var(--accent2)}.art h4.sh{font-size:1em}
.tblw{overflow-x:auto;margin:1em -4px;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.tblw table{border-collapse:collapse;min-width:100%;font-size:.86em;line-height:1.55}
.tblw th,.tblw td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:5em}
.tblw tr:last-child td{border-bottom:0}
.tblw th{background:var(--surface2);white-space:nowrap}
.b-hard{color:var(--accent2)}
.art li.flash,.art h2.flash,.art h3.flash,.art div.flash{animation:flash 2.2s ease-out}
.stamp{font-size:.76rem;color:var(--muted);margin:2px 0 10px}
.lead{margin:6px 0 0;font-size:.92rem;line-height:1.65;opacity:.95}
.quick{display:flex;gap:10px;margin-top:14px}
.quick a{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none}
.quick small{color:var(--muted);font-size:.74rem}
.quick b{font-size:.95rem;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick a.warn{border-color:color-mix(in srgb,var(--accent2) 55%,var(--line))}
.quick a.warn small{color:var(--accent2);font-weight:700}
.row.cinfo{background:color-mix(in srgb,var(--accent2) 9%,var(--surface))}
.row.cinfo .rl{min-height:50px}
.row.cinfo .nm{color:var(--accent2)}
.inf{display:flex;align-items:flex-start;border-top:1px solid var(--line)}
.inf .ib2{flex:1;min-width:0;padding:11px 14px}
.inf:not(:has(.chk)) .ib2{padding-left:16px}
.inf .t{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.inf .en{font-size:.78rem;color:var(--muted)}
.inf .a{font-size:.88rem;line-height:1.6;color:var(--muted);margin-top:3px}
.inf.done .t b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.inf.flash{animation:flash 2.2s ease-out}
.inf .chk{flex:none;width:52px;align-self:stretch;border:0;background:none;display:grid;place-items:start center;padding-top:14px;color:var(--line)}
.inf .chk span{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.inf .chk svg{width:16px;height:16px;stroke-width:3;opacity:0}
.inf.done .chk span{background:var(--ok);border-color:var(--ok);color:#06251a}
.inf.done .chk svg{opacity:1}
.nav a,.nav button{font-size:.68rem}
.nb .lead{margin-bottom:8px}

/* 彈層 */
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(5,2,12,.55);animation:fade .15s}
.sheet{position:fixed;z-index:51;inset:auto 0 0 0;max-height:82dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:var(--shadow);
  padding-bottom:env(safe-area-inset-bottom);animation:up .2s ease-out;max-width:760px;margin:0 auto}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 18px;border-bottom:1px solid var(--line)}
.sheet .sh-b{overflow:auto;overscroll-behavior:contain;padding:6px 0 10px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet .row:first-child{border-top:0}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-height:54px}
.opt:first-child{border-top:0}
.opt>span{font-weight:600}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 13px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:40px;padding:0;white-space:nowrap;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.step output{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums;font-size:.9rem}
.sw{width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.danger{color:#ff6b6b;border-color:currentColor}

.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(var(--nh) + 14px);width:max-content;max-width:min(92vw,520px);display:flex;align-items:center;gap:14px;
  padding:11px 16px;border-radius:14px;background:var(--text);color:var(--bg);font-size:.88rem;box-shadow:var(--shadow);animation:up .2s}
.toast button{border:0;background:none;color:var(--accent);font-weight:800;white-space:nowrap;padding:4px}
:root[data-theme="light"] .toast button{color:#c0185f}

.lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94);overflow:auto;display:grid;place-items:center;overscroll-behavior:contain}
.lb img{max-width:100%;max-height:100dvh;object-fit:contain;cursor:zoom-in}
.lb img.zoom{max-width:none;max-height:none;width:230%;cursor:zoom-out}
.lb .x{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.2rem}
noscript{display:block;padding:40px 20px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:900px){.art{font-size:calc(var(--fs) + 1px)}}

<body>
<header class="top">
  <button class="ib" id="back" aria-label="返回" hidden></button>
  <div class="tt" id="topTitle">GTA 6 攻略</div>
  <button class="ib aa" id="aa" aria-label="閱讀設定">Aa</button>
</header>
<div id="prog" aria-hidden="true"></div>
<div id="offline" hidden>目前離線：文字都能看，沒看過的圖片不會顯示</div>
<main id="view"></main>
<nav class="nav" id="nav" aria-label="主選單"></nav>
<noscript>需要開啟 JavaScript 才能閱讀攻略。</noscript>
<script src="data.js"></script>
<script>
(() => {
"use strict";
const G = window.GUIDE;
if (!G) { document.getElementById("view").textContent = "資料載入失敗，請重新整理。"; return; }

/* ───── 工具 ───── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem("gta6." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("gta6." + k, JSON.stringify(v)); } catch (e) {} },
};
/* 所有來自資料的文字都用 textContent / createTextNode 放進頁面，不經過 innerHTML */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
const ICONS = {
  toc: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  index: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M14 14.5h7M14 20.5h4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  set: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  back: '<path d="m15 5-7 7 7 7"/>', next: '<path d="m9 5 7 7-7 7"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  img: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  notes: '<path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h7"/>',
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 20h8"/>',
};
function ico(name, cls) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "i" + (cls ? " " + cls : "")); s.setAttribute("aria-hidden", "true");
  s.innerHTML = ICONS[name];
  return s;
}
const enc = encodeURIComponent;
const dec = s => { try { return decodeURIComponent(s); } catch (e) { return s; } };
const norm = s => String(s).normalize("NFKC").toLowerCase();

/* ───── 資料 ───── */
const TYPES = [["主線", "main"], ["支線", "side"], ["搶劫", "heist"], ["陌生人", "stranger"], ["可選", "opt"], ["額外", "extra"]];
const tkey = t => (TYPES.find(x => x[0] === t) || [0, "main"])[1];
const missions = [], byId = {};
G.chapters.forEach(ch => ch.missions.forEach(m => {
  m.chap = ch; m.n = missions.length + 1; m.full = !!(m.blocks && m.blocks.length); m.walk = !!(m.steps && m.steps.length);
  missions.push(m); byId[m.id] = m;
}));
const IMG = G.imgBase;

const alias = id => (G.aliases && G.aliases[id]) || id;   // 舊版 ID → 新 ID（來源換了之後保住已存的進度）
const state = {
  done: new Set(store.get("done", []).map(alias).filter(id => byId[id])),
  pos: store.get("pos", null),
  fs: store.get("fs", 17),
  theme: store.get("theme", "auto"),
  imgs: store.get("imgs", true),
  open: store.get("open", null),
  steps: {},
  fav: new Set(store.get("fav", []).map(alias).filter(id => byId[id])),
  stepsOn: store.get("stepsOn", true),
  swipe: store.get("swipe", true),
  awake: store.get("awake", false),
  ticks: new Set(store.get("ticks", [])),
};
/* 步驟標記用「段落內容的雜湊」當鍵，原作者改了前面的段落、插了圖，標記也不會錯位；舊版存的是段落序號，直接丟掉 */
const hkey = t => { let x = 5381; for (let i = 0; i < t.length; i++) x = ((x << 5) + x + t.charCodeAt(i)) >>> 0; return x.toString(36); };
Object.entries(store.get("steps", {}) || {}).forEach(([id, arr]) => {
  id = alias(id);
  const keys = Array.isArray(arr) ? arr.filter(x => typeof x === "string") : [];
  if (byId[id] && keys.length) state.steps[id] = [...new Set([...(state.steps[id] || []), ...keys])];
});
if (state.pos) state.pos.id = alias(state.pos.id);
if (state.pos && !byId[state.pos.id]) state.pos = null;
const saveDone = () => store.set("done", [...state.done]);
const saveFav = () => store.set("fav", [...state.fav]);
const saveSteps = () => store.set("steps", state.steps);
const saveTicks = () => store.set("ticks", [...state.ticks]);
saveDone(); saveFav(); saveSteps(); store.set("pos", state.pos && byId[state.pos.id] ? state.pos : null);

function applyPrefs() {
  const root = document.documentElement;
  root.style.setProperty("--fs", state.fs + "px");
  if (state.theme === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", state.theme);
  const light = state.theme === "light" || (state.theme === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
  $('meta[name="theme-color"]').setAttribute("content", light ? "#faf7f5" : "#14101f");
}
applyPrefs();
matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyPrefs);

/* ───── 共用元件 ───── */
const view = $("#view"), topTitle = $("#topTitle"), nav = $("#nav"), backBtn = $("#back"), prog = $("#prog");
backBtn.append(ico("back"));
let navCount = 0;

function toast(msg, label, fn) {
  $$(".toast").forEach(t => t.remove());
  const t = h("div", { class: "toast", role: "status" }, h("span", { text: msg }),
    label && h("button", { type: "button", text: label, onclick: () => { t.remove(); fn && fn(); } }));
  document.body.append(t);
  setTimeout(() => t.remove(), 5200);
}

let closeSheet = null;
function sheet(title, body, onClose) {
  if (closeSheet) closeSheet();
  const back = h("div", { class: "sheet-back" });
  const panel = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": title },
    h("div", { class: "sh-h" }, h("strong", { text: title }),
      h("button", { class: "ib", type: "button", "aria-label": "關閉", onclick: close, text: "✕" })),
    h("div", { class: "sh-b" }, body));
  const onKey = e => { if (e.key === "Escape") close(); };
  function close() {
    back.remove(); panel.remove(); document.documentElement.classList.remove("lock");
    document.removeEventListener("keydown", onKey); closeSheet = null; onClose && onClose();
  }
  back.addEventListener("click", close);
  document.addEventListener("keydown", onKey);
  document.documentElement.classList.add("lock");
  document.body.append(back, panel);
  closeSheet = close;
  return close;
}

function badge(m) { return m.type !== "主線" ? h("span", { class: "badge b-" + tkey(m.type), text: m.type }) : null; }
function whoChip(who) {
  if (!who) return null;
  const c = /傑森/.test(who) && !/露西亞/.test(who) ? " j" : /露西亞/.test(who) && !/傑森/.test(who) ? " l" : "";
  return h("span", { class: "who" + c, text: who });
}

function missionRow(m, o = {}) {
  const done = state.done.has(m.id);
  const sub = [m.en && m.en !== m.name ? m.en : "", m.sum].filter(Boolean).join(" · ");
  const extra = o.showChap ? m.chap.title + (m.chap.sub ? " · " + m.chap.sub : "") : "";
  return h("div", { class: "row" + (done ? " done" : "") + (o.cur ? " cur" : ""), "data-id": m.id },
    h("a", { class: "rl", href: "#/m/" + enc(m.id), onclick: o.onGo },
      h("span", { class: "num", text: String(m.n).padStart(2, "0") }),
      h("span", { class: "rt" },
        h("span", { class: "nm" }, m.name, state.fav.has(m.id) && h("span", { class: "star", text: "★" }), m.full && ico("img")),
        (sub || extra) && h("span", { class: "nt", text: [extra, sub].filter(Boolean).join(" ‧ ") })),
      m.hard ? h("span", { class: "badge b-hard", text: "常卡" }) : null,
      badge(m)),
    h("button", { class: "chk", type: "button", "aria-pressed": String(done), "aria-label": (done ? "取消完成：" : "標記完成：") + m.name,
      onclick: e => { e.preventDefault(); e.stopPropagation(); toggleDone(m.id); } },
      h("span", {}, ico("check"))));
}

function toggleDone(id) {
  if (state.done.has(id)) state.done.delete(id); else state.done.add(id);
  saveDone();
  if (view.dataset.v === "reader") { updateDoneBtn(); return; }
  const y = scrollY; route(true); scrollTo(0, y);
}

function stats() {
  const main = missions.filter(m => m.type === "主線");
  return {
    all: missions.length, done: missions.filter(m => state.done.has(m.id)).length,
    main: main.length, mainDone: main.filter(m => state.done.has(m.id)).length,
    full: missions.filter(m => m.full).length, walk: missions.filter(m => m.walk).length,
  };
}
/* 各章「這章結束前要做」（會錯過的事）：[{ch, si, ri, row}] */
function missables() {
  const out = [];
  G.chapters.forEach(ch => (ch.info || []).forEach((sec, si) => {
    if (sec.title === "這章結束前要做") sec.rows.forEach((row, ri) => out.push({ ch, si, ri, row }));
  }));
  return out;
}
const missedLeft = () => missables().filter(x => !(x.row.tick && state.ticks.has(x.row.tick))).length;

/* ───── 導覽列 ───── */
function setTop(title, back) {
  topTitle.textContent = title;
  backBtn.hidden = !back;
  document.title = title === "GTA 6 攻略" ? "GTA 6 全任務攻略" : title + " · GTA 6 攻略";
}
function tabs(active) {
  const items = [["toc", "#/", "目錄"], ["notes", "#/notes", "筆記"], ["index", "#/index", "索引"], ["search", "#/search", "搜尋"], ["settings", "#/settings", "設定"]];
  nav.replaceChildren(...items.map(([k, href, label]) =>
    h("a", { href, "aria-current": k === active ? "page" : null, onclick: () => { if (k === active) scrollTo(0, 0); } }, ico(k === "settings" ? "set" : k), label)));
}
function readerBar(m) {
  const prev = missions[m.n - 2], next = missions[m.n];
  nav.replaceChildren(
    h("a", { href: prev ? "#/m/" + enc(prev.id) : null, class: prev ? "" : "dis", "aria-label": "上一個任務" }, ico("back"), "上一個"),
    h("button", { type: "button", class: "mid", onclick: () => openDrawer(m) }, h("span", {}, "任務表"),
      h("span", { class: "s", text: m.n + " / " + missions.length })),
    h("a", { href: next ? "#/m/" + enc(next.id) : null, class: next ? "" : "dis", "aria-label": "下一個任務" }, ico("next"), "下一個"));
}

function openDrawer(cur) {
  const body = h("div", {});
  G.chapters.forEach(ch => {
    body.append(h("div", { class: "sub", text: ch.title + (ch.sub ? " · " + ch.sub : "") }));
    ch.missions.forEach(m => body.append(missionRow(m, { cur: cur && m.id === cur.id, onGo: () => closeSheet && closeSheet() })));
  });
  sheet("任務表", body);
  const c = $(".sheet .row.cur");
  if (c) c.scrollIntoView({ block: "center" });
}

/* ───── 內文渲染（**粗體**、⟦按鍵⟧ 兩種標記；全部用 DOM 方法，不經過 innerHTML） ───── */
function rich(text) {
  const frag = document.createDocumentFragment();
  let bold = false, kbd = false;
  String(text).split(/(\*\*|⟦|⟧)/).forEach(tok => {
    if (tok === "**") { bold = !bold; return; }
    if (tok === "⟦") { kbd = true; return; }
    if (tok === "⟧") { kbd = false; return; }
    if (!tok) return;
    let node = document.createTextNode(tok);
    if (kbd) { const k = h("kbd", { class: "k" }); k.append(node); node = k; }
    if (bold) { const b = document.createElement("strong"); b.append(node); node = b; }
    frag.append(node);
  });
  return frag;
}
const plain = t => String(t).replace(/\*\*|⟦|⟧/g, "");

/* 內容區塊 → DOM。序號規則：段落、標題、表格各 1，清單每個項目 1；textBlocks() 用同一套規則，所以搜尋跳得到 */
function renderBlocks(blocks, o = {}) {
  const frag = document.createDocumentFragment();
  const sd = o.sd || new Set();
  let i = 0;
  const tag = (el, text) => {
    el.dataset.b = i++;
    if (o.tap) { const k = hkey(text); el.dataset.k = k; if (sd.has(k)) el.classList.add("sd"); }
    return el;
  };
  (blocks || []).forEach(b => {
    if (typeof b === "string") frag.append(tag(h("p", {}, rich(b)), b));
    else if (b.h) { const el = h("h" + Math.min(4, Math.max(2, b.l || 2)), { class: "sh" }, b.h); el.dataset.b = i++; frag.append(el); }
    else if (b.ol || b.ul) {
      const list = h(b.ol ? "ol" : "ul", { class: b.ol ? "stp" : "bl" });
      (b.ol || b.ul).forEach(t => list.append(tag(h("li", {}, rich(t)), t)));
      frag.append(list);
    } else if (b.tb) {
      const rows = b.tb.slice(), tbl = h("table", {});
      if (b.hd) tbl.append(h("thead", {}, h("tr", {}, rows.shift().map(c => h("th", {}, rich(c))))));
      tbl.append(h("tbody", {}, rows.map(r => h("tr", {}, r.map(c => h("td", {}, rich(c)))))));
      const w = h("div", { class: "tblw" }, tbl); w.dataset.b = i++; frag.append(w);
    }
  });
  return frag;
}
function textBlocks(blocks) {
  const out = []; let i = 0;
  (blocks || []).forEach(b => {
    if (typeof b === "string") out.push({ i: i++, t: plain(b) });
    else if (b.h) out.push({ i: i++, t: b.h });
    else if (b.ol || b.ul) (b.ol || b.ul).forEach(t => out.push({ i: i++, t: plain(t) }));
    else if (b.tb) out.push({ i: i++, t: plain(b.tb.map(r => r.join(" ")).join(" ")) });
  });
  return out;
}

/* ───── 目錄 ───── */
function tocView() {
  setTop("GTA 6 攻略", false); tabs("toc");
  const s = stats();
  view.append(h("section", { class: "hero" },
    h("div", { class: "eyebrow", text: "GTA VI · 全任務攻略" }),
    h("h1", { text: "GTA 6 全任務攻略" }),
    h("div", { class: "bar" }, h("i", { style: "width:" + (s.done / s.all * 100).toFixed(1) + "%" })),
    h("div", { class: "stats" }, h("span", { text: `已完成 ${s.done} / ${s.all}` }), h("span", { text: `主線 ${s.mainDone} / ${s.main}` }),
      h("span", { text: `${s.walk} 個有逐步攻略・${s.full} 個有截圖` }))));

  const next = missions.find(m => !state.done.has(m.id));
  const left = missedLeft();
  view.append(h("div", { class: "quick" },
    next ? h("a", { href: "#/m/" + enc(next.id) }, h("small", { text: "下一個任務" }), h("b", { text: next.name })) : null,
    h("a", { class: left ? "warn" : "", href: "#/index" }, h("small", { text: left ? "⚠ 會錯過的事" : "會錯過的事" }), h("b", { text: left ? `還有 ${left} 件沒勾` : "都處理好了" }))));

  (G.notices || []).forEach(n => view.append(h("div", { class: "notice" }, h("b", { text: "作者預告" }), h("span", { text: `${n.title}：${n.text}` }))));

  let curChap = next ? next.chap.id : null;
  if (state.pos && byId[state.pos.id]) {
    const m = byId[state.pos.id]; curChap = m.chap.id;
    const pct = state.pos.n > 1 ? Math.round(state.pos.b / (state.pos.n - 1) * 100) : 0;
    view.append(h("a", { class: "cont", href: "#/m/" + enc(m.id) },
      h("small", { text: "繼續閱讀" }),
      h("strong", {}, h("span", { text: `${String(m.n).padStart(2, "0")}　${m.name}` }), h("span", { class: "go", text: pct ? `讀到 ${pct}% ›` : "開始 ›" })),
      pct ? h("div", { class: "mini" }, h("i", { style: "width:" + pct + "%" })) : null));
  }

  const open = new Set(state.open || (curChap ? [curChap] : [G.chapters[0].id]));
  G.chapters.forEach(ch => {
    const n = ch.missions.filter(m => state.done.has(m.id)).length;
    const d = h("details", { class: "chap", "data-id": ch.id },
      h("summary", {},
        h("div", { class: "ct" }, h("b", { text: ch.title }), ch.sub && h("small", { text: ch.sub })),
        h("span", { class: "cn", text: `${n} / ${ch.missions.length}` }), ico("next", "chev")),
      h("div", { class: "cb" }, h("i", { style: "width:" + (n / ch.missions.length * 100) + "%" })));
    if (open.has(ch.id)) d.open = true;
    if ((ch.info || []).length) {
      const miss = (ch.info.find(x => x.title === "這章結束前要做") || { rows: [] }).rows;
      const left = miss.filter(r => !(r.tick && state.ticks.has(r.tick))).length;
      d.append(h("div", { class: "row cinfo" }, h("a", { class: "rl", href: "#/ch/" + ch.no },
        h("span", { class: "num", text: "★" }),
        h("span", { class: "rt" }, h("span", { class: "nm", text: "本章重點" }),
          h("span", { class: "nt", text: left ? `會錯過 ${left} 件・卡關、賺錢、開放功能、人物…` : "卡關、賺錢、開放功能、支線、人物、彩蛋…" })),
        ico("next"))));
    }
    ch.missions.forEach(m => d.append(missionRow(m, { cur: state.pos && state.pos.id === m.id })));
    d.addEventListener("toggle", () => {
      const now = new Set($$("details.chap[open]").map(x => x.dataset.id).filter(Boolean));
      state.open = [...now]; store.set("open", state.open);
    });
    view.append(d);

let haystack = null;
function buildIndex() {
  haystack = [];
  const add = (e, t, pri) => { e.t = t; e.q = norm(t); e.pri = pri || 0; haystack.push(e); };   // q＝正規化文字（別用 n，筆記項目的 n 是筆記本身）
  missions.forEach(m => {
    add({ k: "m", m, b: null }, [m.name, m.aka, m.en, m.note, m.sum, m.who].filter(Boolean).join(" "), 3);
    (m.keys || []).forEach(t => add({ k: "m", m, b: null, md: "s" }, plain(t), 1));
    textBlocks(m.steps).forEach(x => add({ k: "m", m, b: x.i, md: "s" }, x.t));
    (m.blocks || []).forEach((b, i) => { if (typeof b === "string") add({ k: "m", m, b: i, md: "p" }, b); });
    (m.stuck || []).forEach(r => add({ k: "m", m, b: null, md: "s", sub: "常見卡關" }, [r.n, r.a].filter(Boolean).map(plain).join("："), 1));
  });
  G.chapters.forEach(ch => (ch.info || []).forEach((sec, si) => sec.rows.forEach((r, ri) =>
    add({ k: "r", ch, sec, si, ri }, [r.n, r.en, r.k, r.a].filter(Boolean).map(plain).join(" "), 2))));
  (G.notes || []).forEach(n => {
    add({ k: "n", n, b: null }, n.title + " " + (n.sub || ""), 3);
    textBlocks(n.blocks).forEach(x => add({ k: "n", n, b: x.i }, x.t));

}
function snippet(text, terms) {
  const n = norm(text);

  for (const t of terms) { const i = n.indexOf(t); if (i >= 0 && (at < 0 || i < at)) at = i; }

  const part = text.slice(from, to), pn = norm(part);
  const out = h("p", {}); if (from > 0) out.append("…");
  const marks = [];
  terms.forEach(t => { let i = pn.indexOf(t); while (i >= 0) { marks.push([i, i + t.length]); i = pn.indexOf(t, i + t.length); } });
  marks.sort((a, b) => a[0] - b[0]);
  let p = 0;
  for (const [a, b] of marks) { if (a < p) continue; out.append(part.slice(p, a), h("mark", { text: part.slice(a, b) })); p = b; }
  out.append(part.slice(p)); if (to < text.length) out.append("…");
  return out;
}
function hitLink(e, terms) {

  } else {
    href = "#/n/" + enc(e.n.slug) + (e.b != null ? "?p=" + e.b : ""); title = e.n.title; small = "攻略筆記";

}

const toB64 = str => { let bin = ""; new TextEncoder().encode(str).forEach(c => { bin += String.fromCharCode(c); }); return btoa(bin); };

  const pid = o.pos && alias(o.pos.id);

/* 預先下載圖片（要等 Service Worker 接管頁面才存得進去） */
const IMG_CACHE = "gta6-images-v2";
const imgPaths = list => [...new Set(list.flatMap(m => (m.blocks || []).filter(b => typeof b !== "string").map(b => b.i)))];
async function cachedCount(paths) {
  try { const c = await caches.open(IMG_CACHE); const have = new Set((await c.keys()).map(r => r.url)); return paths.filter(p => have.has(IMG + p)).length; }
  catch (e) { return 0; }
}
async function prefetch(paths, onProgress) {
  if (!navigator.serviceWorker || !navigator.serviceWorker.controller) { toast("離線功能還沒啟用，重新整理一次再試"); return null; }
  if (!navigator.onLine) { toast("目前離線，無法下載"); return null; }
  const c = await caches.open(IMG_CACHE);
  const have = new Set((await c.keys()).map(r => r.url));
  const todo = paths.filter(p => !have.has(IMG + p));
  const queue = todo.slice(), total = todo.length;
  let n = 0, fail = 0; onProgress(0, total);
  const worker = async () => {
    while (queue.length) {
      const p = queue.shift();
      try { await fetch(IMG + p, { mode: "no-cors", referrerPolicy: "no-referrer" }); } catch (e) { fail++; }
      onProgress(++n, total);
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  return { total, fail };
}
function downloadBtn(paths, label, after) {
  const b = h("button", { class: "btn", type: "button" });
  const idle = async () => {
    const have = await cachedCount(paths);
    b.replaceChildren(ico(have >= paths.length ? "check" : "img"), have >= paths.length ? `圖片已存好（${paths.length} 張），離線可看` : `${label}（${have} / ${paths.length} 張已存）`);
    after && after();
  };
  b.addEventListener("click", async () => {
    b.disabled = true;
    const r = await prefetch(paths, (d, t) => { b.textContent = t ? `下載中 ${d} / ${t}` : "已經都存好了"; });
    // Service Worker 是在把回應交給頁面「之後」才寫入快取，要等最後幾張寫完再數
    if (r) for (let i = 0; i < 20 && await cachedCount(paths) < paths.length - r.fail; i++) await new Promise(ok => setTimeout(ok, 250));
    b.disabled = false;
    const have = await cachedCount(paths);
    if (r && r.fail) toast(`有 ${r.fail} 張下載失敗，可再按一次重試`);
    else if (r && have < paths.length) toast(`瀏覽器的儲存空間只夠存 ${have} 張，其餘離線時看不到`);
    idle();
  });
  idle();
  return b;
}

        h("button", { class: "btn", style: "flex:none;min-height:40px", type: "button", text: "複製備份碼", onclick: async () => {
          const code = backupCode();
          try { await navigator.clipboard.writeText(code); toast("已複製備份碼"); } catch (e) { prompt("長按全選後複製這串備份碼：", code); }
        } })),
      h("div", { class: "opt" }, h("span", { text: "從備份還原" }),
        h("button", { class: "btn", style: "flex:none;min-height:40px", type: "button", text: "貼上還原", onclick: () => {
          const t = prompt("貼上備份碼（會覆蓋目前的進度）：");
          if (t === null) return;
          try { restoreCode(t); toast("已還原進度"); route(true); } catch (e) { toast("備份碼無法使用：" + e.message); }
        } })),
      h("div", { class: "opt" }, h("span", { text: "重設所有進度" }),
        h("button", { class: "btn danger", style: "flex:none;min-height:40px", type: "button", text: "重設",
          onclick: () => { if (confirm("確定清除所有完成、收藏、步驟標記與閱讀位置？")) { state.done.clear(); state.fav.clear(); state.steps = {}; state.ticks.clear(); state.pos = null; saveDone(); saveFav(); saveSteps(); saveTicks(); store.set("pos", null); toast("已重設"); route(true); } } }))));

  const all = imgPaths(missions);
  const upd = h("button", { class: "btn", style: "flex:none;min-height:40px", type: "button", text: "檢查更新", onclick: checkUpdate });
  const clr = h("button", { class: "btn", style: "flex:none;min-height:40px", type: "button", text: "清除",
    onclick: async () => { try { await caches.delete(IMG_CACHE); toast("已清除離線圖片"); route(true); } catch (e) { toast("清除失敗"); } } });
  view.append(h("div", { class: "sect", text: "離線與更新" }),
    h("div", { class: "card" },
      h("div", { class: "pad" }, downloadBtn(all, "下載全部圖片供離線", null),
        h("div", { class: "small muted", style: "margin-top:8px", text: "文字本來就能離線看。圖片是原站的，沒下載的話只有看過的會暫存；瀏覽器對這類圖片算很佔空間，可能存不滿全部 " + all.length + " 張（存滿會自動丟掉最舊的），存不滿時會告訴你存了幾張。" })),
      h("div", { class: "opt" }, h("span", {}, "檢查新版本", h("small", { text: "原作者補寫新章節、重新整理資料後用" })), upd),
      h("div", { class: "opt" }, h("span", {}, "清除離線圖片"), clr)));

  view.append(h("div", { class: "sect", text: "安裝到主畫面" }),
    h("div", { class: "card" }, h("div", { class: "how" },
      h("div", {}, h("b", { text: "iPhone（Safari）：" }), "點下方分享鈕 → 加入主畫面。"),
      h("div", {}, h("b", { text: "Android（Chrome）：" }), "右上選單 → 安裝應用程式（或加到主畫面）。"),
      h("div", { text: "裝好後會像 App 一樣全螢幕開啟。" }))));
  view.append(sourcesFoot());
}
async function checkUpdate() {
  if (!("serviceWorker" in navigator)) { toast("這個瀏覽器不支援離線更新"); return; }
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) { toast("尚未安裝離線版本"); return; }
    await reg.update();
    toast(reg.installing || reg.waiting ? "發現新版本，正在更新…" : "已經是最新版");
  } catch (e) { toast("目前無法檢查，請確認網路"); }
}

/* ───── 閱讀 ───── */
let saveT = 0, readerMission = null, doneBtn = null;
function updateDoneBtn() {
  if (!doneBtn || !readerMission) return;
  const d = state.done.has(readerMission.id);
  doneBtn.className = "btn" + (d ? " ok" : "");
  doneBtn.replaceChildren(ico("check"), d ? "已完成（點一下取消）" : "標記完成");
  doneBtn.setAttribute("aria-pressed", String(d));
}
function mkShot(blk, i) {
  const path = blk.i;
  const fig = h("figure", { class: "shot", "data-b": i, style: blk.w && blk.h ? `--ar:${blk.w}/${blk.h}` : null });
  const load = retry => {
    fig.replaceChildren(); fig.classList.remove("ok"); fig.classList.add("loading");
    const img = new Image();
    img.referrerPolicy = "no-referrer"; img.decoding = "async"; img.loading = "lazy"; img.alt = "步驟圖";
    img.addEventListener("load", () => { fig.classList.remove("loading"); fig.classList.add("ok"); });
    img.addEventListener("error", () => {
      fig.classList.remove("loading"); fig.replaceChildren(h("button", { class: "imgbtn", type: "button", onclick: () => load(true),
        text: navigator.onLine ? "圖片載入失敗，點一下重試" : "離線中，這張圖還沒存過" }));
    });
    img.src = IMG + path + (retry ? "?r=" + Date.now() : "");
    fig.append(img);
  };
  if (state.imgs) load(); else fig.append(h("button", { class: "imgbtn", type: "button", text: "顯示圖片", onclick: () => load() }));
  return fig;
}
let readerMode = "s";
function readerView(m, q) {
  readerMission = m;
  view.dataset.v = "reader";
  setTop(m.name, true); readerBar(m);
  const hasS = m.walk, hasP = m.full;
  const want = q.get("md");
  const mode = hasS && hasP ? (want === "p" || want === "s" ? want : store.get("mode", "s")) : hasS ? "s" : "p";
  readerMode = mode;
  const art = h("article", { class: "art" + (state.stepsOn ? " steps" : ""), id: "art" });
  const favBtn = h("button", { class: "pill", type: "button", "aria-pressed": String(state.fav.has(m.id)),
    onclick: () => {
      if (state.fav.has(m.id)) state.fav.delete(m.id); else state.fav.add(m.id);
      saveFav(); const on = state.fav.has(m.id);
      favBtn.setAttribute("aria-pressed", String(on)); favBtn.textContent = on ? "★ 已收藏" : "☆ 收藏";
    } }, state.fav.has(m.id) ? "★ 已收藏" : "☆ 收藏");
  art.append(h("div", { class: "kick", text: `${m.chap.title}${m.chap.sub ? " · " + m.chap.sub : ""}　#${String(m.n).padStart(2, "0")}` }),
    h("h1", { text: m.name }),
    h("div", { class: "meta" }, badge(m) || h("span", { class: "badge b-main", text: "主線" }), whoChip(m.who),
      m.hard ? h("span", { class: "badge b-hard", text: "常卡關" }) : null,
      m.en && m.en !== m.name ? h("span", { text: m.en }) : null, m.note ? h("span", { text: "· " + m.note }) : null, favBtn),
    m.aka ? h("div", { class: "stamp", text: "另一種叫法：" + m.aka }) : null);
  if (m.sum) art.append(h("div", { class: "sum" }, h("b", { text: "摘要　" }), m.sum));
  if (m.keys && m.keys.length) art.append(h("div", { class: "keys" }, h("b", { class: "t", text: "重點" }),
    h("ul", { class: "bl" }, m.keys.map(k => h("li", {}, rich(k))))));

  if (hasS && hasP) {
    const seg = h("div", { class: "seg full", role: "group", "aria-label": "攻略版本" },
      [["s", "文字步驟"], ["p", "截圖圖文"]].map(([k, label]) => h("button", { type: "button", "aria-pressed": String(mode === k), text: label,
        onclick: () => { if (mode === k) return; store.set("mode", k); history.replaceState(null, "", "#/m/" + enc(m.id)); route(); } })));
    art.append(seg);
  }

  const sd = new Set(state.steps[m.id] || []);   // 已標記項目的雜湊鍵
  if (mode === "s") {
    art.append(renderBlocks(m.steps, { tap: state.stepsOn, sd }));
  } else {
    m.blocks.forEach((b, i) => {
      if (typeof b !== "string") { art.append(mkShot(b, i)); return; }
      const k = hkey(b);
      art.append(h("p", { "data-b": i, "data-k": k, class: sd.has(k) ? "sd" : null, text: b }));
    });
  }
  art.addEventListener("click", e => {
    const el = e.target.closest && e.target.closest("[data-k]");
    if (!el || !state.stepsOn || String(getSelection()).length) return;
    const k = el.dataset.k, set = new Set(state.steps[m.id] || []);
    if (set.has(k)) set.delete(k); else set.add(k);
    el.classList.toggle("sd", set.has(k));
    if (set.size) state.steps[m.id] = [...set]; else delete state.steps[m.id];
    saveSteps();
    const clr = $("#clrSteps"); if (clr) clr.parentNode.hidden = !set.size;
    if (!store.get("hintSteps", false)) { store.set("hintSteps", true); toast("已標記這一步，再點一下可取消"); }
  });

  if (m.stuck && m.stuck.length) art.append(h("div", { class: "sect", text: "常見卡關 · " + m.stuck.length }),
    h("div", { class: "card" }, m.stuck.map(r => h("div", { class: "hit" }, h("b", { text: r.n }), r.k ? h("small", { text: r.k }) : null, r.a ? h("p", {}, rich(r.a)) : null))));

  doneBtn = h("button", { type: "button", onclick: () => { toggleDone(m.id); } });
  const next = missions[m.n];
  art.append(h("div", { class: "cta" }, doneBtn, next ? h("a", { class: "btn pri", href: "#/m/" + enc(next.id) }, "下一個", ico("next")) : null));
  const paths = imgPaths([m]);
  if (paths.length && mode === "p") art.append(h("div", { class: "cta", style: "margin-top:0" }, downloadBtn(paths, "下載本任務圖片供離線")));
  const clr = h("button", { id: "clrSteps", class: "btn", type: "button", text: "清除本任務的步驟標記", onclick: () => {
    delete state.steps[m.id]; saveSteps(); $$("#art .sd").forEach(p => p.classList.remove("sd")); clr.parentNode.hidden = true;
  } });
  art.append(h("div", { class: "cta", style: "margin-top:0", hidden: (state.steps[m.id] || []).length ? null : true }, clr));
  if (m.url) art.append(h("div", { class: "cta", style: "margin-top:0" },
    h("a", { class: "btn", href: m.url, target: "_blank", rel: "noopener noreferrer" }, ico("ext"), "在 oplay 看這個任務（含地圖）")));
  if (!next) art.append(h("p", { class: "muted small", text: "已經讀到目前整理的最後一個任務。" }));
  view.append(art); updateDoneBtn();

  const p = q.get("p");
  const resume = state.pos && state.pos.id === m.id && state.pos.md === mode && state.pos.b > 0;
  const target = p != null ? +p : resume ? state.pos.b : 0;
  if (p != null || resume) {
    requestAnimationFrame(() => {
      const byKey = p == null && state.pos && state.pos.k ? $(`#art [data-k="${state.pos.k}"]`) : null;
      const el = byKey || $(`#art [data-b="${target}"]`);
      if (!el) return;
      el.scrollIntoView({ block: "start" });
      if (p != null) { el.classList.add("flash"); }
      else toast("已回到上次讀到的位置", "從頭開始", () => { scrollTo(0, 0); state.pos = { id: m.id, b: 0, k: null, md: mode, n: $$("#art [data-b]").length }; store.set("pos", state.pos); });
    });
  } else { state.pos = { id: m.id, b: 0, k: null, md: mode, n: $$("#art [data-b]").length }; store.set("pos", state.pos); }
  updateProg();
}
function updateProg() {
  if (view.dataset.v !== "reader") { prog.style.width = "0"; return; }
  const max = document.documentElement.scrollHeight - innerHeight;
  prog.style.width = (max > 0 ? Math.min(1, scrollY / max) * 100 : 0) + "%";
}
function savePos() {
  if (view.dataset.v !== "reader" || !readerMission) return;
  const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hh")) || 60;
  let b = 0, k = null;
  const els = $$("#art [data-b]");
  for (const el of els) { b = +el.dataset.b; k = el.dataset.k || null; if (el.getBoundingClientRect().bottom > top + 6) break; }
  state.pos = { id: readerMission.id, b, k, md: readerMode, n: els.length }; store.set("pos", state.pos);
}
addEventListener("scroll", () => { updateProg(); clearTimeout(saveT); saveT = setTimeout(savePos, 300); }, { passive: true });
document.addEventListener("visibilitychange", () => { if (document.hidden) savePos(); wakeSync(); });
addEventListener("pagehide", savePos);

/* 圖片放大：點一下開，再點圖片切換 2.3 倍，點旁邊或 ✕ 關閉 */
document.addEventListener("click", e => {
  const img = e.target.closest && e.target.closest(".shot img");
  if (!img) return;
  const big = h("img", { src: img.src, alt: "", referrerpolicy: "no-referrer" });
  const full = img.src.replace(/_S\.(jpe?g|png|webp)$/i, ".$1");   // _S 是 600 寬縮圖，沒有 _S 的是原圖
  if (full !== img.src) { const pre = new Image(); pre.referrerPolicy = "no-referrer"; pre.onload = () => { big.src = full; }; pre.src = full; }
  const lb = h("div", { class: "lb", role: "dialog", "aria-modal": "true", "aria-label": "放大檢視" }, big,
    h("button", { class: "x", type: "button", "aria-label": "關閉", text: "✕" }));
  const close = () => { lb.remove(); document.documentElement.classList.remove("lock"); document.removeEventListener("keydown", onKey); };
  const onKey = ev => { if (ev.key === "Escape") close(); };
  lb.addEventListener("click", ev => { if (ev.target === big) big.classList.toggle("zoom"); else close(); });
  document.addEventListener("keydown", onKey);
  document.documentElement.classList.add("lock"); document.body.append(lb);
});

/* ───── 路由 ───── */
const scrolls = {};
let routeKey = "";
function parseHash() {
  const raw = location.hash.slice(1) || "/";
  const [path, qs] = raw.split("?");
  return { parts: path.split("/").filter(Boolean).map(dec), q: new URLSearchParams(qs || "") };
}
function route(keepScroll) {
  if (closeSheet) closeSheet();
  if (routeKey && !keepScroll) scrolls[routeKey] = scrollY;
  savePos();
  const { parts, q } = parseHash();
  const root = parts[0] || "toc";
  routeKey = (root === "m" || root === "ch" || root === "n" ? root + "/" + parts[1] : root);
  view.replaceChildren(); view.dataset.v = ""; readerMission = null; doneBtn = null; clearTimeout(saveT);
  if (root === "m" && byId[parts[1]]) { view.dataset.v = "reader"; readerView(byId[parts[1]], q); }
  else {
    view.dataset.v = root;
    if (root === "index") indexView(); else if (root === "search") searchView(q); else if (root === "settings") settingsView();
    else if (root === "notes") notesView();
    else if (root === "ch") chapterView(+parts[1] || 1, q);
    else if (root === "n" && noteBy[parts[1]]) noteView(noteBy[parts[1]], q);
    else tocView();
    scrollTo(0, keepScroll ? scrollY : (scrolls[routeKey] || 0));
  }
  if (root === "m" && q.get("p") == null && !(state.pos && state.pos.id === parts[1] && state.pos.md === readerMode && state.pos.b > 0)) scrollTo(0, 0);
  updateProg(); wakeSync();
}
addEventListener("hashchange", () => { navCount++; route(); });
backBtn.addEventListener("click", () => { if (navCount > 0) history.back(); else location.hash = "#/"; });
$("#aa").addEventListener("click", () => sheet("閱讀設定", controls(false)));
addEventListener("keydown", e => {
  if (view.dataset.v !== "reader" || !readerMission || e.target.closest("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.key === "ArrowLeft" ? missions[readerMission.n - 2] : e.key === "ArrowRight" ? missions[readerMission.n] : null;
  if (t) location.hash = "#/m/" + enc(t.id);
});
/* 左右滑切換任務：要夠長、夠快、夠水平，且避開螢幕邊緣（系統返回手勢） */
let tstart = null;
document.addEventListener("touchstart", e => {
  tstart = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() } : null;
}, { passive: true });
document.addEventListener("touchend", e => {
  const s = tstart; tstart = null;
  if (!s || !state.swipe || view.dataset.v !== "reader" || !readerMission || closeSheet || $(".lb")) return;
  if (s.x < 24 || s.x > innerWidth - 24) return;
  const t = e.changedTouches[0], dx = t.clientX - s.x, dy = t.clientY - s.y;
  if (Math.abs(dx) < 110 || Math.abs(dx) < Math.abs(dy) * 3 || Date.now() - s.t > 600) return;
  const target = dx < 0 ? missions[readerMission.n] : missions[readerMission.n - 2];
  if (target) location.hash = "#/m/" + enc(target.id);
}, { passive: true });
const offline = $("#offline");
const syncOnline = () => { offline.hidden = navigator.onLine; };
addEventListener("online", syncOnline); addEventListener("offline", syncOnline); syncOnline();
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
route();

/* ───── 離線（Service Worker） ───── */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return;
    toast("攻略已更新到新版本", "重新整理", () => { reloading = true; location.reload(); });
  });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(err => console.warn("離線功能啟用失敗", err));
}
})();
